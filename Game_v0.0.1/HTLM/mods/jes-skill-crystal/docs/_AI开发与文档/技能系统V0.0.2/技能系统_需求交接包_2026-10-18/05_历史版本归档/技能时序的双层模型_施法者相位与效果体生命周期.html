<svg width="100%" viewBox="0 0 680 336" role="img" xmlns="http://www.w3.org/2000/svg">
<title>技能时序的双层模型：施法者相位与效果体生命周期</title>
<desc>上层为施法者的四个相位（索敌决定、起手蓄力、出手、冷却），构成闭环；下层为效果实例的五段生命周期（生成、存活运动、命中零到多次、终止、回收），其中命中可派生新实例并递归回到生成。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="40" width="600" height="112" rx="20" fill="var(--color-background-secondary)" stroke="#378ADD" stroke-width="0.5"/>
<text x="60" y="62" dominant-baseline="central" font-size="13" font-weight="500" fill="var(--color-text-primary)">层一 · 施法者相位（每个英雄一条，闭环）</text>
<rect x="60" y="76" width="131" height="56" rx="8" fill="var(--color-background-primary)" stroke="#378ADD" stroke-width="0.5"/>
<text x="125" y="96" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="var(--color-text-primary)">索敌决定</text>
<text x="125" y="115" text-anchor="middle" dominant-baseline="central" font-size="12" fill="var(--color-text-secondary)">tick</text>
<rect x="203" y="76" width="131" height="56" rx="8" fill="var(--color-background-primary)" stroke="#378ADD" stroke-width="0.5"/>
<text x="268" y="96" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="var(--color-text-primary)">起手 · 蓄力</text>
<text x="268" y="115" text-anchor="middle" dominant-baseline="central" font-size="12" fill="var(--color-text-secondary)">字段已备 尚未接线</text>
<rect x="346" y="76" width="131" height="56" rx="8" fill="var(--color-background-primary)" stroke="#378ADD" stroke-width="0.5"/>
<text x="411" y="96" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="var(--color-text-primary)">出手</text>
<text x="411" y="115" text-anchor="middle" dominant-baseline="central" font-size="12" fill="var(--color-text-secondary)">spawnEffect</text>
<rect x="489" y="76" width="131" height="56" rx="8" fill="var(--color-background-primary)" stroke="#378ADD" stroke-width="0.5"/>
<text x="554" y="96" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="var(--color-text-primary)">冷却</text>
<text x="554" y="115" text-anchor="middle" dominant-baseline="central" font-size="12" fill="var(--color-text-secondary)">cooldownFor</text>
<path d="M554 136 C554 152 125 152 125 136" fill="none" stroke="#378ADD" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="340" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" fill="var(--color-text-tertiary)">冷却结束回到索敌 —— 这是闭环，不是单程线</text>
<rect x="40" y="192" width="600" height="124" rx="20" fill="var(--color-background-secondary)" stroke="#1D9E75" stroke-width="0.5"/>
<text x="60" y="214" dominant-baseline="central" font-size="13" font-weight="500" fill="var(--color-text-primary)">层二 · 效果体生命周期（0 到 N 个实例，每个各走一遍）</text>
<path d="M160 254H175" fill="none" stroke="var(--color-border-primary)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M275 254H290" fill="none" stroke="var(--color-border-primary)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M390 254H405" fill="none" stroke="var(--color-border-primary)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M505 254H520" fill="none" stroke="var(--color-border-primary)" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="226" width="100" height="56" rx="8" fill="var(--color-background-primary)" stroke="#1D9E75" stroke-width="0.5"/>
<text x="110" y="246" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="var(--color-text-primary)">生成</text>
<text x="110" y="265" text-anchor="middle" dominant-baseline="central" font-size="12" fill="var(--color-text-secondary)">bornStep 守卫</text>
<rect x="175" y="226" width="100" height="56" rx="8" fill="var(--color-background-primary)" stroke="#1D9E75" stroke-width="0.5"/>
<text x="225" y="246" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="var(--color-text-primary)">存活运动</text>
<text x="225" y="265" text-anchor="middle" dominant-baseline="central" font-size="12" fill="var(--color-text-secondary)">phaseSweep</text>
<rect x="290" y="226" width="100" height="56" rx="8" fill="var(--color-background-primary)" stroke="#BA7517" stroke-width="1"/>
<text x="340" y="246" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="var(--color-text-primary)">命中 0~N 次</text>
<text x="340" y="265" text-anchor="middle" dominant-baseline="central" font-size="12" fill="var(--color-text-secondary)">事件 非状态</text>
<rect x="405" y="226" width="100" height="56" rx="8" fill="var(--color-background-primary)" stroke="#1D9E75" stroke-width="0.5"/>
<text x="455" y="246" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="var(--color-text-primary)">终止</text>
<text x="455" y="265" text-anchor="middle" dominant-baseline="central" font-size="12" fill="var(--color-text-secondary)">到期/贯穿/越界</text>
<rect x="520" y="226" width="100" height="56" rx="8" fill="var(--color-background-primary)" stroke="#1D9E75" stroke-width="0.5"/>
<text x="570" y="246" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="var(--color-text-primary)">回收</text>
<text x="570" y="265" text-anchor="middle" dominant-baseline="central" font-size="12" fill="var(--color-text-secondary)">phaseRecycle</text>
<path d="M340 282 C340 300 110 300 110 294" fill="none" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="340" y="304" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#BA7517">命中可派生新实例 → 递归回到「生成」</text>
</svg>
