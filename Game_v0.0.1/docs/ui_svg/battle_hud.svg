<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" font-family="sans-serif">
  <desc>战斗HUD 720x1280，布局「上战场、下信息」：上半屏战场，下半屏信息层</desc>
  <rect x="0" y="0" width="720" height="1280" fill="#EFE4CE" stroke="#4A3B2A" stroke-width="4"/>
  <!-- z1 上半屏战场 y0~760 -->
  <rect x="0" y="0" width="720" height="760" fill="#F3E8D2" stroke="#4A3B2A" stroke-width="3"/>
  <text x="360" y="40" text-anchor="middle" font-size="24" fill="#4A3B2A">z1 战场层 y0 h760（连续地图+地形格64px）</text>
  <g stroke="#B8A88A" stroke-width="1" fill="none">
    <path d="M0 150 H720 M0 250 H720 M0 350 H720 M0 450 H720 M0 550 H720 M0 650 H720"/>
    <path d="M100 0 V760 M220 0 V760 M340 0 V760 M460 0 V760 M580 0 V760"/>
  </g>
  <rect x="220" y="250" width="120" height="100" fill="#BFE3DF" stroke="#35E0D8" stroke-width="3"/>
  <text x="280" y="305" text-anchor="middle" font-size="14" fill="#2A7F79">水格</text>
  <rect x="460" y="450" width="120" height="100" fill="#F0C9B8" stroke="#C63D2F" stroke-width="3"/>
  <text x="520" y="505" text-anchor="middle" font-size="14" fill="#8F2318">火格</text>
  <circle cx="300" cy="560" r="26" fill="#CFE8D8" stroke="#4A3B2A" stroke-width="3"/>
  <text x="300" y="620" text-anchor="middle" font-size="14" fill="#4A3B2A">队长（青光圈+朝向箭头）</text>
  <circle cx="470" cy="300" r="22" fill="#E8B8B0" stroke="#C63D2F" stroke-width="3"/>
  <text x="470" y="360" text-anchor="middle" font-size="14" fill="#8F2318">敌人群</text>
  <circle cx="560" cy="620" r="60" fill="none" stroke="#C63D2F" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="560" y="705" text-anchor="middle" font-size="14" fill="#8F2318">红圈预警（1s 蓄力）</text>
  <!-- z2 下半信息层 y760~1280 -->
  <rect x="0" y="760" width="720" height="520" fill="#EFE4CE" stroke="#4A3B2A" stroke-width="3"/>
  <text x="360" y="800" text-anchor="middle" font-size="22" fill="#4A3B2A">z2 信息层 y760 h520</text>
  <!-- z2a 头像血条组 -->
  <g stroke="#4A3B2A" stroke-width="3" fill="#F7EEDB">
    <rect x="40" y="820" width="150" height="80"/><rect x="210" y="820" width="150" height="80"/><rect x="380" y="820" width="150" height="80"/>
  </g>
  <rect x="40" y="820" width="150" height="80" fill="none" stroke="#E8B33C" stroke-width="5"/>
  <rect x="50" y="870" width="130" height="16" fill="#CFE8D8" stroke="#4A3B2A" stroke-width="2"/>
  <text x="115" y="862" text-anchor="middle" font-size="15" fill="#4A3B2A">头像+血条（金框=操控中）</text>
  <text x="290" y="862" text-anchor="middle" font-size="15" fill="#4A3B2A">队友1</text>
  <text x="455" y="862" text-anchor="middle" font-size="15" fill="#4A3B2A">队友2</text>
  <rect x="560" y="820" width="120" height="80" fill="#F7EEDB" stroke="#4A3B2A" stroke-width="3"/>
  <text x="620" y="855" text-anchor="middle" font-size="14" fill="#4A3B2A">Tab切人</text>
  <text x="620" y="880" text-anchor="middle" font-size="14" fill="#6B5B45">CD 2s 灰显</text>
  <!-- z2b 技能CD行 -->
  <g stroke="#4A3B2A" stroke-width="3" fill="#F7EEDB">
    <circle cx="110" cy="980" r="48"/><circle cx="240" cy="980" r="48"/><circle cx="370" cy="980" r="48"/>
  </g>
  <path d="M110 932 A48 48 0 1 1 66 1004" fill="none" stroke="#35E0D8" stroke-width="5"/>
  <text x="110" y="986" text-anchor="middle" font-size="15" fill="#4A3B2A">技A环CD</text>
  <text x="240" y="986" text-anchor="middle" font-size="15" fill="#4A3B2A">技B环CD</text>
  <text x="370" y="986" text-anchor="middle" font-size="15" fill="#4A3B2A">神权图标</text>
  <!-- z2c 计时条 -->
  <rect x="40" y="1060" width="640" height="34" fill="#F7EEDB" stroke="#4A3B2A" stroke-width="3"/>
  <rect x="42" y="1062" width="400" height="30" fill="#CFE8D8"/>
  <text x="360" y="1084" text-anchor="middle" font-size="15" fill="#4A3B2A">z2c 章节计时条（临近神罚变朱砂闪烁）</text>
  <!-- z2d 组合面板 -->
  <rect x="40" y="1120" width="640" height="60" fill="#F7EEDB" stroke="#E8B33C" stroke-width="4"/>
  <text x="360" y="1158" text-anchor="middle" font-size="18" fill="#4A3B2A">z2d 组合面板（1 行白话：火格击杀→供盾）</text>
  <!-- z2e 残片计数 -->
  <rect x="40" y="1200" width="300" height="56" fill="#F7EEDB" stroke="#4A3B2A" stroke-width="3"/>
  <text x="190" y="1236" text-anchor="middle" font-size="17" fill="#4A3B2A">残片/经验条 ◆ 128</text>
  <rect x="380" y="1200" width="300" height="56" fill="#F7EEDB" stroke="#4A3B2A" stroke-width="3"/>
  <text x="530" y="1236" text-anchor="middle" font-size="17" fill="#4A3B2A">暂停 ｜ 伤害飘字层</text>
</svg>
