<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" font-family="sans-serif">
  <desc>事件界面（渎神/敬神二选一）720x1280，z序：1底 2标题 3双卡 4结果词条</desc>
  <rect x="0" y="0" width="720" height="1280" fill="#EFE4CE" stroke="#4A3B2A" stroke-width="4"/>
  <!-- z1 底景 -->
  <text x="360" y="60" text-anchor="middle" font-size="18" fill="#6B5B45">z1 底景：祭坛暗化场景（半透明遮罩）</text>
  <!-- z2 标题 -->
  <rect x="60" y="100" width="600" height="110" fill="#F7EEDB" stroke="#4A3B2A" stroke-width="3"/>
  <text x="360" y="145" text-anchor="middle" font-size="26" fill="#4A3B2A">z2 事件标题「香案前的选择」</text>
  <text x="360" y="185" text-anchor="middle" font-size="17" fill="#6B5B45">z2 事件正文 2 行（第 X 章 · 双轨不互斥）</text>
  <!-- z3 双卡：渎神（左）/ 敬神（右） -->
  <g>
    <rect x="45" y="280" width="290" height="560" fill="#F7EEDB" stroke="#C63D2F" stroke-width="5"/>
    <text x="190" y="330" text-anchor="middle" font-size="24" fill="#8F2318">z3 渎神卡</text>
    <rect x="75" y="360" width="230" height="180" fill="#F0C9B8" stroke="#C63D2F" stroke-width="3"/>
    <text x="190" y="455" text-anchor="middle" font-size="16" fill="#8F2318">插画位 230x180</text>
    <text x="190" y="590" text-anchor="middle" font-size="16" fill="#4A3B2A">收益：圣物栏 +1</text>
    <text x="190" y="625" text-anchor="middle" font-size="16" fill="#4A3B2A">代价：随机 1 人 CD 翻倍 10s</text>
    <text x="190" y="670" text-anchor="middle" font-size="16" fill="#8F2318">Boss 获「神怒」</text>
    <text x="190" y="705" text-anchor="middle" font-size="16" fill="#8F2318">半血时全体 AoE 12 点</text>
    <rect x="95" y="760" width="190" height="60" fill="#F7EEDB" stroke="#C63D2F" stroke-width="4"/>
    <text x="190" y="798" text-anchor="middle" font-size="19" fill="#8F2318">渎神按钮</text>
  </g>
  <g>
    <rect x="385" y="280" width="290" height="560" fill="#F7EEDB" stroke="#E8B33C" stroke-width="5"/>
    <text x="530" y="330" text-anchor="middle" font-size="24" fill="#B8860B">z3 敬神卡</text>
    <rect x="415" y="360" width="230" height="180" fill="#F5E6C0" stroke="#E8B33C" stroke-width="3"/>
    <text x="530" y="455" text-anchor="middle" font-size="16" fill="#B8860B">插画位 230x180</text>
    <text x="530" y="590" text-anchor="middle" font-size="16" fill="#4A3B2A">收益：全队 +8 盾</text>
    <text x="530" y="625" text-anchor="middle" font-size="16" fill="#4A3B2A">代价：无即时惩罚</text>
    <text x="530" y="670" text-anchor="middle" font-size="16" fill="#B8860B">Boss 获「圣偿」</text>
    <text x="530" y="705" text-anchor="middle" font-size="16" fill="#B8860B">每 15s 回复 5% HP</text>
    <rect x="435" y="760" width="190" height="60" fill="#F7EEDB" stroke="#E8B33C" stroke-width="4"/>
    <text x="530" y="798" text-anchor="middle" font-size="19" fill="#B8860B">敬神按钮</text>
  </g>
  <!-- z4 结果词条位 -->
  <rect x="60" y="900" width="600" height="90" fill="#F7EEDB" stroke="#4A3B2A" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="360" y="940" text-anchor="middle" font-size="18" fill="#6B5B45">z4 结果词条区 y900 h90</text>
  <text x="360" y="970" text-anchor="middle" font-size="16" fill="#6B5B45">（抉择后显示规则变更白话）</text>
  <!-- z5 继续 -->
  <rect x="180" y="1060" width="360" height="100" fill="#F7EEDB" stroke="#4A3B2A" stroke-width="4"/>
  <text x="360" y="1120" text-anchor="middle" font-size="24" fill="#4A3B2A">z5 继续按钮 360x100</text>
</svg>
