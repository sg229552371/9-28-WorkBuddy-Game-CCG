<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" font-family="sans-serif">
  <desc>神殿商店 720x1280，z序：1底 2标题+余额 3货架 4详情 5操作</desc>
  <rect x="0" y="0" width="720" height="1280" fill="#EFE4CE" stroke="#4A3B2A" stroke-width="4"/>
  <!-- z1 标题与余额 -->
  <rect x="40" y="60" width="640" height="120" fill="#F7EEDB" stroke="#4A3B2A" stroke-width="3"/>
  <text x="70" y="110" font-size="26" fill="#4A3B2A">z1 神殿商店</text>
  <text x="650" y="110" text-anchor="end" font-size="20" fill="#B8860B">神话残片 ◆ 340</text>
  <text x="70" y="155" font-size="16" fill="#6B5B45">z1 副行：金圣物概率 12%（商店加成）</text>
  <!-- z2 货架 2x3 -->
  <text x="360" y="230" text-anchor="middle" font-size="20" fill="#4A3B2A">z2 货架区（2行x3列，格 190x260，间距25）</text>
  <g stroke="#4A3B2A" stroke-width="3" fill="#F7EEDB">
    <rect x="45"  y="250" width="190" height="260"/><rect x="265" y="250" width="190" height="260"/><rect x="485" y="250" width="190" height="260"/>
    <rect x="45"  y="535" width="190" height="260"/><rect x="265" y="535" width="190" height="260"/><rect x="485" y="535" width="190" height="260"/>
  </g>
  <g font-size="15" fill="#4A3B2A" text-anchor="middle">
    <text x="140" y="330">圣物格（金框=金）</text><text x="360" y="330">圣物格</text><text x="580" y="330">圣物格</text>
    <text x="140" y="370">价签 ◆60</text><text x="360" y="370">价签 ◆80</text><text x="580" y="370">已售出</text>
    <text x="140" y="615">技能升级格</text><text x="360" y="615">圣物格</text><text x="580" y="615">圣物格</text>
    <text x="140" y="655">价签 ◆50</text><text x="360" y="655">价签 ◆60</text><text x="580" y="655">—</text>
  </g>
  <rect x="45" y="250" width="190" height="260" fill="none" stroke="#E8B33C" stroke-width="5"/>
  <!-- z3 详情面板 -->
  <rect x="40" y="830" width="640" height="170" fill="#F7EEDB" stroke="#4A3B2A" stroke-width="3"/>
  <text x="65" y="870" font-size="19" fill="#4A3B2A">z3 详情面板 y830 h170</text>
  <text x="65" y="905" font-size="16" fill="#6B5B45">选中圣物名 + 效果白话 + rationale 一行</text>
  <text x="65" y="940" font-size="16" fill="#6B5B45">组合提示：与当前神权的联动词条</text>
  <!-- z4 操作区 -->
  <g stroke="#4A3B2A" stroke-width="4" fill="#F7EEDB">
    <rect x="40" y="1040" width="300" height="100"/>
    <rect x="380" y="1040" width="300" height="100"/>
  </g>
  <text x="190" y="1098" text-anchor="middle" font-size="22" fill="#4A3B2A">z4 购买</text>
  <text x="530" y="1098" text-anchor="middle" font-size="22" fill="#4A3B2A">z4 刷新（价格-20% 图腾生效）</text>
  <!-- z5 离开 -->
  <rect x="180" y="1170" width="360" height="70" fill="#F7EEDB" stroke="#4A3B2A" stroke-width="3"/>
  <text x="360" y="1215" text-anchor="middle" font-size="20" fill="#4A3B2A">z5 离开商店 360x70</text>
</svg>
