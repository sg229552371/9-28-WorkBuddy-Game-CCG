    <!-- 刷新剩余次数 + 刷新按钮 -->
    <text x="640" y="498" font-size="16" fill="#f2fafe" text-anchor="middle">本局强化刷新剩余次数：<tspan fill="#ffe073" font-weight="700">3</tspan></text>
