<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <title>005-战斗 · 整屏总图 v5.0（HUD 血条删除 / 经验条+等级落底 / 圆形图标按钮 / 强化入口按钮+次数 / 强化面板可关闭可点击 / 删小字）</title>

  <defs>
    <linearGradient id="btlBg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0d1017"/>
      <stop offset="0.55" stop-color="#12161f"/>
      <stop offset="1" stop-color="#161b26"/>
    </linearGradient>
    <radialGradient id="btlGround" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#1d2a26" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#141b20" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="btlVig" cx="0.5" cy="0.5" r="0.62">
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="btlXp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bff2ff"/>
      <stop offset="1" stop-color="#7fd8ef"/>
    </linearGradient>
    <filter id="btlBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- ============ L0 战场底 ============ -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#btlBg)"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#btlGround)"/>
  <g stroke="#22302e" stroke-width="1" opacity="0.5">
    <path d="M0 120 L1280 120 M0 240 L1280 240 M0 360 L1280 360 M0 480 L1280 480 M0 600 L1280 600"/>
    <path d="M160 0 L160 720 M320 0 L320 720 M480 0 L480 720 M640 0 L640 720 M800 0 L800 720 M960 0 L960 720 M1120 0 L1120 720"/>
  </g>
  <g filter="url(#btlBlur)" opacity="0.5">
    <circle cx="210" cy="330" r="26" fill="#2a3a33"/><circle cx="210" cy="330" r="9" fill="#3d5a4a"/>
    <circle cx="430" cy="470" r="20" fill="#26332e"/><circle cx="430" cy="470" r="7" fill="#3a5446"/>
    <circle cx="880" cy="360" r="30" fill="#2c3a34"/><circle cx="880" cy="360" r="10" fill="#43604f"/>
    <path d="M700 290 l22 -34 l22 34 z" fill="#33282a"/>
    <path d="M120 540 l16 -24 l16 24 z" fill="#33282a"/>
  </g>
  <g filter="url(#btlBlur)" stroke="#8a6b3a" stroke-width="2.5" opacity="0.35" stroke-linecap="round">
    <path d="M760 430 L800 410"/><path d="M300 400 L338 382"/>
  </g>
  <g opacity="0.75">
    <circle cx="640" cy="400" r="18" fill="#31465a" stroke="#5f88a8" stroke-width="2"/>
    <path d="M640 400 L712 380" stroke="#e8b33c" stroke-width="1.6" stroke-dasharray="6 4" opacity="0.8"/>
  </g>
  <rect x="0" y="0" width="1280" height="720" fill="url(#btlVig)"/>

  <!-- ============ HUD v5.0（弹出升级窗口时被黑幕压暗） ============ -->
  <g>
    <!-- 顶部合并文案（等级已移至底部经验条旁） -->
    <text x="640" y="34" font-size="17" fill="#ffffff" text-anchor="middle" stroke="#000000" stroke-width="4" paint-order="stroke" stroke-linejoin="round">击败 32/60　·　波次 5　·　剩余 96s</text>
    <!-- Z7 事件 Banner -->
    <rect x="440" y="48" width="400" height="30" rx="6" fill="#1a1710" fill-opacity="0.88" stroke="#e8b33c" stroke-width="1.5"/>
    <text x="640" y="68" font-size="15" fill="#ffe073" text-anchor="middle" stroke="#000000" stroke-width="3" paint-order="stroke" stroke-linejoin="round">撤离点已出现：进圈读条 8 秒撤离</text>
    <!-- 右上资源（上移；HP 已删：角色头顶自带血条） -->
    <g text-anchor="end" stroke="#000000" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
      <text x="1264" y="40" font-size="18" fill="#ffe073">✦ 金币 128</text>
      <text x="1264" y="66" font-size="16" fill="#c9d4e2">宝箱 2　·　场上怪 27</text>
    </g>
    <!-- 移速负重 -->
    <path d="M22 582 h9 v8 h8 v5 h-17 z" fill="#e6d9b3" stroke="#000000" stroke-width="2" paint-order="stroke"/>
    <path d="M14 584 h6 M12 589 h7 M14 594 h6" stroke="#e6d9b3" stroke-width="1.8" stroke-linecap="round"/>
    <text x="52" y="598" font-size="18" fill="#e6d9b3" stroke="#000000" stroke-width="4" paint-order="stroke" stroke-linejoin="round">移速 -50%</text>
    <!-- 左下：背包 = 圆形图标按钮（纯图标 + Tab 角标） -->
    <g>
      <circle cx="44" cy="648" r="26" fill="#0d0f1a" fill-opacity="0.9" stroke="#5d6575" stroke-width="2"/>
      <rect x="33" y="642" width="22" height="16" rx="3" fill="none" stroke="#e2e6ee" stroke-width="2"/>
      <path d="M37 642 v-4 a7 6 0 0 1 14 0 v4" fill="none" stroke="#e2e6ee" stroke-width="2"/>
      <path d="M33 650 h22" stroke="#e2e6ee" stroke-width="1.6" opacity="0.7"/>
      <rect x="48" y="662" width="30" height="14" rx="7" fill="#232a38" stroke="#5d6575" stroke-width="1"/>
      <text x="63" y="672" font-size="9.5" fill="#c9d4e2" text-anchor="middle" font-weight="700">Tab</text>
    </g>
    <!-- 左下：强化入口 = 圆形图标按钮 + 剩余次数角标（点击打开 Z8 面板） -->
    <g>
      <circle cx="114" cy="648" r="26" fill="#0d0f1a" fill-opacity="0.9" stroke="#e8b33c" stroke-width="2"/>
      <rect x="104" y="638" width="20" height="20" rx="4" transform="rotate(45 114 648)" fill="#2a2410" stroke="#ffd140" stroke-width="2"/>
      <path d="M114 641 v14 M107 648 h14" stroke="#ffe073" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="132" cy="630" r="11" fill="#ffd140" stroke="#141414" stroke-width="2"/>
      <text x="132" y="635" font-size="12" fill="#141414" text-anchor="middle" font-weight="700">3</text>
    </g>
    <!-- 底部技能栏（上移，给底部经验条让位） -->
    <rect x="290" y="598" width="700" height="82" rx="10" fill="#0d0f1a" fill-opacity="0.68"/>
    <circle cx="334" cy="640" r="22" fill="#d97333" stroke="#ffd140" stroke-width="2"/>
    <text x="334" y="647" font-size="18" fill="#ffffff" text-anchor="middle">猎</text>
    <rect x="368" y="618" width="44" height="44" rx="6" fill="#232a38" stroke="#e8b33c" stroke-width="1.5"/>
    <text x="390" y="646" font-size="17" fill="#ffe073" text-anchor="middle">✦</text>
    <circle cx="407" cy="620" r="9" fill="#e8b33c"/>
    <text x="407" y="624" font-size="11" fill="#141414" text-anchor="middle" font-weight="700">3</text>
    <circle cx="580" cy="640" r="22" fill="#4080d9" stroke="#3a4150" stroke-width="2"/>
    <text x="580" y="647" font-size="18" fill="#ffffff" text-anchor="middle">守</text>
    <rect x="614" y="618" width="44" height="44" rx="6" fill="#232a38" stroke="#3a4150" stroke-width="1.5"/>
    <circle cx="653" cy="620" r="9" fill="#5d6575"/>
    <text x="653" y="624" font-size="11" fill="#141414" text-anchor="middle" font-weight="700">2</text>
    <circle cx="826" cy="640" r="22" fill="#4dbf73" stroke="#3a4150" stroke-width="2"/>
    <text x="826" y="647" font-size="18" fill="#ffffff" text-anchor="middle">医</text>
    <rect x="860" y="618" width="44" height="44" rx="6" fill="#232a38" stroke="#3a4150" stroke-width="1.5"/>
    <circle cx="899" cy="620" r="9" fill="#e8b33c"/>
    <text x="899" y="624" font-size="11" fill="#141414" text-anchor="middle" font-weight="700">4</text>
    <!-- 右下：自动战斗 = 圆形图标按钮（开=翡翠绿环 + 绿闪电；关=灰环）+ G 角标 -->
    <g>
      <circle cx="1216" cy="648" r="26" fill="#12241a" fill-opacity="0.92" stroke="#4de666" stroke-width="2.5"/>
      <path d="M1219 632 l-11 15 h7 l-4 15 l13 -18 h-7 z" fill="#8cd99a"/>
      <rect x="1220" y="662" width="26" height="14" rx="7" fill="#232a38" stroke="#5d6575" stroke-width="1"/>
      <text x="1233" y="672" font-size="9.5" fill="#c9d4e2" text-anchor="middle" font-weight="700">G</text>
    </g>
    <!-- 底部通栏：共享经验条 + 等级（全屏唯一出处，落屏最底） -->
    <rect x="16" y="697" width="52" height="17" rx="8" fill="#1a2430" stroke="#7fd8ef" stroke-width="1"/>
    <text x="42" y="709" font-size="11.5" fill="#bff2ff" text-anchor="middle" font-weight="700">Lv 12</text>
    <rect x="78" y="701" width="1186" height="11" rx="5.5" fill="#0d0d14" fill-opacity="0.92"/>
    <rect x="80" y="703" width="710" height="7" rx="3.5" fill="url(#btlXp)"/>
  </g>

  <!-- ============ 45% 黑幕 ============ -->
  <rect x="0" y="0" width="1280" height="720" fill="#000000" fill-opacity="0.45"/>

  <!-- ============ Z8 升级强化窗口 v5.0（卡片式：可点击 / 可关闭 / 删小字） ============ -->
  <g>
    <rect x="190" y="76" width="900" height="560" rx="14" fill="#131722" fill-opacity="0.97" stroke="#e8b33c" stroke-width="2"/>
    <rect x="198" y="84" width="884" height="544" rx="10" fill="none" stroke="#2b3240" stroke-width="1"/>
    <text x="640" y="124" font-size="26" font-weight="700" fill="#ffe073" text-anchor="middle">✦ 选择一项强化 ✦</text>
    <path d="M340 138 h210 M730 138 h210" stroke="#e8b33c" stroke-width="1" opacity="0.55"/>
    <!-- 关闭按钮：✕（Esc 同效，次数保留） -->
    <circle cx="1058" cy="104" r="14" fill="#2a2f3d" stroke="#5d6575" stroke-width="1.5"/>
    <path d="M1052 98 l12 12 M1064 98 l-12 12" stroke="#c9d4e2" stroke-width="2" stroke-linecap="round"/>

    <!-- 卡1 猎手·输出（红顶带，可选中/悬停高亮态） -->
    <g>
      <rect x="216" y="152" width="200" height="320" rx="12" fill="#1c2230" stroke="#ffd140" stroke-width="2"/>
      <path d="M216 164 a12 12 0 0 1 12 -12 h176 a12 12 0 0 1 12 12 v18 h-200 z" fill="#ff6b6b"/>
      <text x="316" y="177" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">猎手 · 技能</text>
      <circle cx="316" cy="248" r="44" fill="#26314a"/>
      <rect x="288" y="220" width="56" height="56" rx="8" transform="rotate(45 316 248)" fill="#33233a" stroke="#ff6b6b" stroke-width="2"/>
      <path d="M300 264 l20 -20 M322 230 l10 10 M298 268 l-4 4 l4 4 l4 -4 z" stroke="#ffd140" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="348" cy="216" r="11" fill="#ffd140"/>
      <text x="348" y="221" font-size="12" fill="#141414" text-anchor="middle" font-weight="700">+1</text>
      <text x="278" y="322" font-size="20" fill="#ffd140" text-anchor="middle">★</text>
      <text x="300" y="322" font-size="20" fill="#ffd140" text-anchor="middle">★</text>
      <text x="322" y="322" font-size="20" fill="#ffd140" text-anchor="middle">★</text>
      <text x="344" y="322" font-size="20" fill="#4a5262" text-anchor="middle">★</text>
      <text x="316" y="352" font-size="13" fill="#c9d4e2" text-anchor="middle">射出箭矢伤害 <tspan fill="#8cd99a" font-weight="700">+3</tspan></text>
      <text x="316" y="372" font-size="13" fill="#c9d4e2" text-anchor="middle">攻击间隔不变，伤害更稳</text>
      <circle cx="316" cy="424" r="17" fill="#d97333" stroke="#ffd140" stroke-width="1.5"/>
      <text x="316" y="430" font-size="14" fill="#ffffff" text-anchor="middle">猎</text>
    </g>

    <!-- 卡2 全局技能（金顶带） -->
    <g>
      <rect x="432" y="152" width="200" height="320" rx="12" fill="#1c2230" stroke="#3a4150" stroke-width="1.5"/>
      <path d="M432 164 a12 12 0 0 1 12 -12 h176 a12 12 0 0 1 12 12 v18 h-200 z" fill="#ffd140"/>
      <text x="532" y="177" font-size="15" font-weight="700" fill="#141414" text-anchor="middle">全局技能</text>
      <circle cx="532" cy="248" r="44" fill="#26314a"/>
      <rect x="504" y="220" width="56" height="56" rx="8" transform="rotate(45 532 248)" fill="#2a2f3d" stroke="#ffd140" stroke-width="2"/>
      <path d="M517 264 c0 -10 10 -15 15 -7 c5 -8 15 -3 15 7 c0 10 -15 22 -15 22 c0 0 -15 -12 -15 -22 z" fill="#e2554f"/>
      <text x="494" y="322" font-size="20" fill="#ffd140" text-anchor="middle">★</text>
      <text x="516" y="322" font-size="20" fill="#ffd140" text-anchor="middle">★</text>
      <text x="538" y="322" font-size="20" fill="#4a5262" text-anchor="middle">★</text>
      <text x="560" y="322" font-size="20" fill="#4a5262" text-anchor="middle">★</text>
      <text x="532" y="352" font-size="13" fill="#c9d4e2" text-anchor="middle">生命上限 <tspan fill="#8cd99a" font-weight="700">+15</tspan>，全体生效</text>
      <text x="532" y="372" font-size="13" fill="#c9d4e2" text-anchor="middle">站圈读条更有底气</text>
      <rect x="500" y="406" width="64" height="24" rx="12" fill="#2a2f3d" stroke="#ffd140" stroke-width="1.5"/>
      <text x="532" y="423" font-size="13" fill="#ffe073" text-anchor="middle">全 局</text>
    </g>

    <!-- 卡3 守护者·防御（蓝顶带） -->
    <g>
      <rect x="648" y="152" width="200" height="320" rx="12" fill="#1c2230" stroke="#3a4150" stroke-width="1.5"/>
      <path d="M648 164 a12 12 0 0 1 12 -12 h176 a12 12 0 0 1 12 12 v18 h-200 z" fill="#6cb2ff"/>
      <text x="748" y="177" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">守护者 · 技能</text>
      <circle cx="748" cy="248" r="44" fill="#26314a"/>
      <rect x="720" y="220" width="56" height="56" rx="8" transform="rotate(45 748 248)" fill="#23304a" stroke="#6cb2ff" stroke-width="2"/>
      <path d="M732 234 h9 v8 h8 v5 h-17 z" fill="#bff2ff"/>
      <path d="M726 236 h5 M724 241 h6 M726 246 h5" stroke="#bff2ff" stroke-width="2" stroke-linecap="round"/>
      <text x="710" y="322" font-size="20" fill="#ffd140" text-anchor="middle">★</text>
      <text x="732" y="322" font-size="20" fill="#ffd140" text-anchor="middle">★</text>
      <text x="754" y="322" font-size="20" fill="#4a5262" text-anchor="middle">★</text>
      <text x="776" y="322" font-size="20" fill="#4a5262" text-anchor="middle">★</text>
      <text x="748" y="352" font-size="13" fill="#c9d4e2" text-anchor="middle">移动速度 <tspan fill="#8cd99a" font-weight="700">+10%</tspan></text>
      <text x="748" y="372" font-size="13" fill="#c9d4e2" text-anchor="middle">躲弹幕更从容，负重压力更小</text>
      <circle cx="748" cy="424" r="17" fill="#4080d9" stroke="#6cb2ff" stroke-width="1.5"/>
      <text x="748" y="430" font-size="14" fill="#ffffff" text-anchor="middle">守</text>
    </g>

    <!-- 卡4 医疗兵·辅助（绿顶带） -->
    <g>
      <rect x="864" y="152" width="200" height="320" rx="12" fill="#1c2230" stroke="#3a4150" stroke-width="1.5"/>
      <path d="M864 164 a12 12 0 0 1 12 -12 h176 a12 12 0 0 1 12 12 v18 h-200 z" fill="#6bd88a"/>
      <text x="964" y="177" font-size="15" font-weight="700" fill="#141414" text-anchor="middle">医疗兵 · 技能</text>
      <circle cx="964" cy="248" r="44" fill="#26314a"/>
      <rect x="936" y="220" width="56" height="56" rx="8" transform="rotate(45 964 248)" fill="#223a2c" stroke="#6bd88a" stroke-width="2"/>
      <circle cx="964" cy="248" r="13" fill="none" stroke="#8cd99a" stroke-width="2.5"/>
      <path d="M964 231 v6 M964 259 v6 M947 248 h6 M975 248 h6" stroke="#8cd99a" stroke-width="2.5" stroke-linecap="round"/>
      <text x="926" y="322" font-size="20" fill="#ffd140" text-anchor="middle">★</text>
      <text x="948" y="322" font-size="20" fill="#4a5262" text-anchor="middle">★</text>
      <text x="970" y="322" font-size="20" fill="#4a5262" text-anchor="middle">★</text>
      <text x="992" y="322" font-size="20" fill="#4a5262" text-anchor="middle">★</text>
      <text x="964" y="352" font-size="13" fill="#c9d4e2" text-anchor="middle">射击间隔 <tspan fill="#8cd99a" font-weight="700">-8%</tspan>，子弹更密</text>
      <text x="964" y="372" font-size="13" fill="#c9d4e2" text-anchor="middle">超重惩罚下依旧保持输出</text>
      <circle cx="964" cy="424" r="17" fill="#4dbf73" stroke="#6bd88a" stroke-width="1.5"/>
      <text x="964" y="430" font-size="14" fill="#ffffff" text-anchor="middle">医</text>
    </g>

    <!-- 刷新按钮（剩余次数并入按钮角标，不再单独一行小字） -->
    <rect x="540" y="500" width="200" height="46" rx="10" fill="#25314a" stroke="#6cb2ff" stroke-width="2"/>
    <path d="M574 523 a10 10 0 1 1 3 7 M576 516 v7 h7" fill="none" stroke="#bfd9ff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="648" y="529" font-size="16" fill="#bfd9ff" text-anchor="middle" font-weight="700">刷 新 (R)</text>
    <circle cx="744" cy="500" r="12" fill="#6cb2ff" stroke="#141414" stroke-width="2"/>
    <text x="744" y="505" font-size="12" fill="#141414" text-anchor="middle" font-weight="700">3</text>
  </g>

  <!-- ============ 标注层 ============ -->
  <g opacity="0.9">
    <g stroke="#e8b33c" stroke-width="1" stroke-dasharray="5 4" fill="none">
      <rect x="216" y="152" width="200" height="320" rx="12"/>
      <rect x="432" y="152" width="200" height="320" rx="12"/>
      <rect x="648" y="152" width="200" height="320" rx="12"/>
      <rect x="864" y="152" width="200" height="320" rx="12"/>
      <rect x="540" y="500" width="200" height="46" rx="10"/>
    </g>
    <g font-size="11" fill="#8d95a5">
      <text x="1104" y="180">Z8 卡片式 ×4 · 可点击</text>
      <text x="1104" y="196">卡 200×320 · 间距 16</text>
      <text x="1104" y="212">顶带=类别色</text>
      <text x="1104" y="228">宝石座 56 旋转 45°</text>
      <text x="1104" y="244">★ 等级 · 数值高亮</text>
      <text x="1104" y="260">（增益绿/负面红）</text>
      <text x="1104" y="276">徽章=归属</text>
      <text x="1104" y="304">✕ / Esc 关闭面板</text>
      <text x="1104" y="320">（次数保留可再开）</text>
      <text x="1104" y="336">刷新 200×46 · R 键</text>
      <text x="1104" y="352">次数并入按钮角标</text>
      <text x="1104" y="368">底部两行小字已删</text>
      <text x="1104" y="408">HUD：血条已删</text>
      <text x="1104" y="424">（角色头顶自带）</text>
      <text x="1104" y="440">经验条+Lv 落屏最底</text>
      <text x="1104" y="456">强化入口：左下圆钮</text>
      <text x="1104" y="472">+次数角标，点开 Z8</text>
      <text x="1104" y="488">背包/自动战斗 =</text>
      <text x="1104" y="504">圆形图标按钮 r26</text>
    </g>
  </g>

  <text x="16" y="30" font-size="11" fill="#5d6575" opacity="0.85">虚线金字为标注层，游戏内不显示</text>
  <text x="1264" y="690" font-size="11" fill="#5d6575" text-anchor="end" opacity="0.85">A002-UI层-战斗总SVG文档 / 1280×720 / v5.0</text>
</svg>
