<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <title>B005 负重 · v5.0 定稿（腿部移速图标 + 百分比；超 100% 变红；不再画数字条）</title>
  <rect width="1280" height="720" fill="#10151d"/>
  <g opacity="0.15">
    <rect x="0" y="0" width="1280" height="720" fill="#1a2230"/>
  </g>

  <!-- 左下移速负重（v5.0 上移至 (22,582)，为其下圆形按钮让位） -->
  <g>
    <!-- 腿部移速图标（跑步小人简形） -->
    <circle cx="30" cy="588" r="3" fill="#e2e6ee"/>
    <path d="M30 591 l-4 9 M30 591 l5 6 6 2 M30 591 l-6 4 -6 1" fill="none" stroke="#e2e6ee" stroke-width="2" stroke-linecap="round"/>
    <text x="52" y="600" font-size="18" fill="#e2e6ee" font-weight="700">移速 -50%</text>
  </g>

  <!-- 对比：超 100% 超载态 -->
  <g>
    <circle cx="30" cy="628" r="3" fill="#ff8a84"/>
    <path d="M30 631 l-4 9 M30 631 l5 6 6 2 M30 631 l-6 4 -6 1" fill="none" stroke="#ff8a84" stroke-width="2" stroke-linecap="round"/>
    <text x="52" y="640" font-size="18" fill="#ff8a84" font-weight="700">移速 -65%</text>
    <text x="146" y="640" font-size="11" fill="#ff8a84" opacity="0.85">← 超 100%：图标与数字一起变红</text>
  </g>

  <!-- 标注 -->
  <g opacity="0.55">
    <g stroke="#e8b33c" stroke-width="1" stroke-dasharray="4 3" fill="none">
      <rect x="14" y="574" width="120" height="34"/>
    </g>
    <g fill="#e8b33c" font-size="10.5">
      <text x="146" y="588">腿形图标 @ (22,582) + 文案 (52,598) 18 号</text>
      <text x="146" y="604" fill="#8d95a5">v5.0 上移：为其下背包/强化圆形按钮让位（B008）</text>
      <text x="146" y="620" fill="#8d95a5">数字条方案（180×10，v2.0）已作废</text>
    </g>
  </g>

  <!-- 版本注记 -->
  <g opacity="0.9">
    <rect x="920" y="64" width="328" height="82" rx="8" fill="#0d1017" stroke="#2b3240"/>
    <text x="936" y="87" font-size="12" font-weight="700" fill="#e8b33c">B005 · v5.0 定稿（2026-10-27）</text>
    <text x="936" y="106" font-size="11" fill="#8d95a5">v3.0：负重数字条改「腿部移速图标 + 百分比」——玩家关心的是变慢了多少</text>
    <text x="936" y="124" font-size="11" fill="#5d6575">移速图标与升级选项 3（靴）图标同源</text>
    <text x="936" y="140" font-size="11" fill="#5d6575">超 100% 变红（全项目负面红 #ff8a84）</text>
  </g>
  <text x="1248" y="708" font-size="11" fill="#5d6575" text-anchor="end">A002-UI层-SVG文档-战斗 / B005-负重条 / v5.0</text>
</svg>
