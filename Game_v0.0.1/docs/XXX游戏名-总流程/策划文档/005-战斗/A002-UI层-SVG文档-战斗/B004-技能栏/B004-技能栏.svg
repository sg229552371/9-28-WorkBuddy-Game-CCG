    <text x="356" y="226" font-size="20" fill="#4a5260" text-anchor="middle">空</text>
    <text x="422" y="226" font-size="20" fill="#4a5260" text-anchor="middle">空</text>
    <g font-size="20" fill="#bfccd9" text-anchor="middle">
      <text x="224" y="272">Lv1</text><text x="290" y="272">Lv1</text><text x="356" y="272">Lv1</text><text x="422" y="272">Lv1</text>
    </g>

