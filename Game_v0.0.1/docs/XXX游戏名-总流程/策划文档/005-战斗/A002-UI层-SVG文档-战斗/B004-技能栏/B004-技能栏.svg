  <g>
    <rect x="32" y="84" width="1216" height="332" rx="12" fill="#12161f" fill-opacity="0.9" stroke="#2b3240" stroke-width="1.5"/>
    <text x="52" y="110" font-size="12" fill="#5d6575" letter-spacing="2">放大展示 · 一组拆解（头像 2 倍 / 槽 2 倍）</text>

