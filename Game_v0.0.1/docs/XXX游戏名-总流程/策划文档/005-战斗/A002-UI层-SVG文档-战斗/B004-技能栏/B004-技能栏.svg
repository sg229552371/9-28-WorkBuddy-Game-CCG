      <g fill="#1f222b" fill-opacity="0.9">
        <rect x="927" y="202" width="28" height="28" rx="4"/>
        <rect x="960" y="202" width="28" height="28" rx="4"/>
        <rect x="993" y="202" width="28" height="28" rx="4"/>
        <rect x="1026" y="202" width="28" height="28" rx="4"/>
      </g>
