        <text x="1142" y="244">Lv1</text><text x="1175" y="244">Lv1</text>
      </g>
      <text x="1196" y="244" font-size="10" fill="#5d6575">…被截断</text>
    </g>
    <text x="672" y="278" font-size="11" fill="#5d6575">底板高 130，内容垂直居中；3 组实测约 750 宽，1280 屏够放</text>

    <!-- 职业色对照 -->
    <text x="660" y="316" font-size="13" fill="#e8b33c">职业色（avatar 圆形底色）</text>
    <g>
      <circle cx="680" cy="344" r="12" fill="#d97333"/>
      <text x="700" y="349" font-size="12" fill="#cdd3de">输出 #d97333（代码 rgb 0.85,0.45,0.2）</text>
      <circle cx="940" cy="344" r="12" fill="#4080d9"/>
      <text x="960" y="349" font-size="12" fill="#cdd3de">防御 #4080d9</text>
      <circle cx="1080" cy="344" r="12" fill="#4dbf73"/>
      <text x="1100" y="349" font-size="12" fill="#cdd3de">辅助 #4dbf73</text>
      <circle cx="1190" cy="344" r="12" fill="#738099"/>
      <text x="1210" y="349" font-size="12" fill="#cdd3de">未知</text>
