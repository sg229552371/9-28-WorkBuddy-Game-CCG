    <text x="660" y="380" font-size="11" fill="#5d6575">注：cfg/heroRoles.json 配置色为 #ff6b6b / #6cb2ff / #6bd88a，与代码画出来的色不一致（总纲 T6）</text>
  </g>

  <!-- ================= 图角红字：真实问题 ================= -->
  <g>
    <rect x="32" y="432" width="1216" height="62" rx="8" fill="#2a1013" fill-opacity="0.94" stroke="#e2554f" stroke-width="1.5"/>
    <text x="48" y="458" font-size="15" font-weight="700" fill="#ff7b73">真实问题：4 个格子永远显示同一个 Lv 数字，视觉上没意义；格子是空框，没有技能图标</text>
    <text x="48" y="480" font-size="12" fill="#f0a9a4">代码第 646~659 行：for i in range(4) 里 lv_lb.text = "Lv%d" % lv，lv 是英雄等级 → 12 格共 4 个不同数字，每组内 4 个完全相同</text>
  </g>

  <!-- ================= 结构规格卡 ================= -->
  <g>
    <rect x="32" y="512" width="600" height="176" rx="10" fill="#0d1017" fill-opacity="0.96" stroke="#3a4150" stroke-width="1.5"/>
    <text x="48" y="536" font-size="13" font-weight="700" fill="#e8b33c">结构规格</text>
    <g font-size="12" fill="#cdd3de">
      <text x="48" y="558">底板　居中 bottom-190 → bottom-60（y 530~660）　高 130　rx 10</text>
      <text x="48" y="576">底色　rgba(13,15,26,0.62)　无边框（半透，透出底下战场）</text>
      <text x="48" y="594">组间 24　组内列间距 6　槽间 5　槽与 Lv 间距 2</text>
      <text x="48" y="612">名字行 14 号 #f2fafe，格式「名字 · role 原字段」</text>
      <text x="48" y="630">头像 44×44 正圆 rx22，内字 20 号取英雄名首字</text>
      <text x="48" y="648">槽 28×28 rx4　底 rgba(31,34,43,0.9)　无图标 / 无快捷键 / 无冷却</text>
      <text x="48" y="666">槽下 Lv 10 号 #bfccd9　→ 每格都有，但值相同</text>
    </g>
  </g>

  <g>
    <rect x="648" y="512" width="600" height="176" rx="10" fill="#0d1017" fill-opacity="0.96" stroke="#3a4150" stroke-width="1.5"/>
    <text x="664" y="536" font-size="13" font-weight="700" fill="#e8b33c">行为规则（灰字）</text>
    <g font-size="11.5" fill="#8a93a5">
      <text x="664" y="558">· 只在开局建一次，进战斗后不再刷新：头像 / 名字 / 槽 / Lv 全是死的</text>
      <text x="664" y="576">· 队员阵亡无任何表现（头像不变灰、不打叉）——与「三人同场」卖点冲突</text>
      <text x="664" y="594">· 头像可点但点了没有反馈（Button 未接任何回调）</text>
      <text x="664" y="612">· 队伍读取失败 → 整条隐藏，回退到 hud_skill 一行文字</text>
      <text x="664" y="630">· 底板不挡中部战场：底边 y=660，与左下负重 y=678 不重叠</text>
      <text x="664" y="648">· 待办 T5：4 个空框填真技能 / 缩成 1 个大图标 / 去掉整条，三选一</text>
      <text x="664" y="666">· 代码：battle.gd _build_skill_bar() 第 586~669 行</text>
    </g>
  </g>

  <text x="1248" y="708" font-size="11" fill="#5d6575" text-anchor="end">B004-技能栏 / 1280×720 / v1.0</text>
</svg>
