    <g stroke="#e8b33c" stroke-width="1.2" fill="none">
      <path d="M72 220 L72 264 M64 220 L80 220 M64 264 L80 264" marker-start="url(#btlArrowS)" marker-end="url(#btlArrow)"/>
      <path d="M524 192 L524 248 M516 192 L532 192 M516 248 L532 248" marker-start="url(#btlArrowS)" marker-end="url(#btlArrow)"/>
      <path d="M196 166 L252 166 M262 166 L318 166" marker-start="url(#btlArrowS)" marker-end="url(#btlArrow)"/>
    </g>
    <text x="88" y="250" font-size="13" fill="#e8b33c">44（2×）</text>
    <text x="538" y="226" font-size="13" fill="#e8b33c">28（2×）</text>
    <text x="259" y="160" font-size="12" fill="#e8b33c">5（2×）</text>
    <text x="196" y="304" font-size="12" fill="#8a93a5">每格下 10 号灰 #bfccd9，重复同一 lv（读 hero_out_level）</text>

    <!-- 三组并排（实尺寸示意，1:1） -->
    <text x="660" y="146" font-size="13" fill="#e8b33c">1:1 实尺寸 · 三组并排（组间距 24）</text>
    <rect x="660" y="162" width="560" height="130" rx="10" fill="#0d0f1a" fill-opacity="0.62" stroke="#2b3240" stroke-width="1"/>
    <g>
      <text x="672" y="184" font-size="14" fill="#f2fafe">猎手 · output</text>
      <circle cx="694" cy="216" r="22" fill="#d97333"/>
      <text x="694" y="223" font-size="20" fill="#ffffff" text-anchor="middle">猎</text>
      <g fill="#1f222b" fill-opacity="0.9">
        <rect x="726" y="202" width="28" height="28" rx="4"/>
        <rect x="759" y="202" width="28" height="28" rx="4"/>
        <rect x="792" y="202" width="28" height="28" rx="4"/>
        <rect x="825" y="202" width="28" height="28" rx="4"/>
      </g>
      <g font-size="10" fill="#bfccd9" text-anchor="middle">
        <text x="740" y="244">Lv1</text><text x="773" y="244">Lv1</text><text x="806" y="244">Lv1</text><text x="839" y="244">Lv1</text>
      </g>
    </g>
    <g>
      <text x="873" y="184" font-size="14" fill="#f2fafe">守护者 · defense</text>
      <circle cx="895" cy="216" r="22" fill="#4080d9"/>
