    <g>
      <text x="1074" y="184" font-size="14" fill="#f2fafe">医疗兵 · aux</text>
      <circle cx="1096" cy="216" r="22" fill="#4dbf73"/>
      <text x="1096" y="223" font-size="20" fill="#ffffff" text-anchor="middle">医</text>
      <g fill="#1f222b" fill-opacity="0.9">
        <rect x="1128" y="202" width="28" height="28" rx="4"/>
        <rect x="1161" y="202" width="28" height="28" rx="4"/>
