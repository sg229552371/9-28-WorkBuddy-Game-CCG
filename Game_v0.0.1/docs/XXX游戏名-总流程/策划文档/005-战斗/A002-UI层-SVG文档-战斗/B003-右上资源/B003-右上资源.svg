  <rect width="1280" height="720" fill="#10151d"/>
  <g opacity="0.15">
    <rect x="0" y="0" width="1280" height="720" fill="#1a2230"/>
    <circle cx="640" cy="400" r="14" fill="#e2e6ee"/>
  </g>

  <!-- Z3 右上资源栈（v5.0：两行，右对齐 x=1264） -->
  <g>
    <circle cx="1216" cy="34" r="9" fill="none" stroke="#e8b33c" stroke-width="2"/>
    <text x="1216" y="39" font-size="11" fill="#e8b33c" text-anchor="middle" font-weight="700">✦</text>
    <text x="1264" y="41" font-size="18" fill="#e8b33c" text-anchor="end" font-weight="700">340</text>
    <text x="1264" y="70" font-size="16" fill="#c9ced9" text-anchor="end">📦 2　·　场上怪 37</text>
