      <rect x="1100" y="18" width="176" height="60"/>
    </g>
    <text x="1092" y="34" font-size="10.5" fill="#8d95a5" text-anchor="end">金币行 18 号 · 资源行 16 号</text>
    <text x="1092" y="50" font-size="10.5" fill="#8d95a5" text-anchor="end">右对齐 x=1264 · 行距 26</text>
    <text x="1092" y="66" font-size="10.5" fill="#e8b33c" text-anchor="end">y=40/66（v5.0 上移让出顶部）</text>
