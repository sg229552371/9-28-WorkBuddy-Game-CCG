<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <title>B008 暂停与操作提示 · v5.0 定稿（圆形纯图标按钮 r26：背包左下 / 强化入口左下 / 自动战斗右下；提示两行精简）</title>
  <rect width="1280" height="720" fill="#10151d"/>
  <g opacity="0.15">
    <rect x="0" y="0" width="1280" height="720" fill="#1a2230"/>
  </g>

  <!-- 左下：移速（其上，见 B005） + 两颗圆形按钮 -->
  <text x="52" y="560" font-size="14" fill="#5d6575">▲ 移速 -50%（B005）</text>

  <!-- 背包（圆形 r26 + 箱子图标 + Tab 角标） -->
  <circle cx="44" cy="648" r="26" fill="#1d2432" stroke="#4a5568" stroke-width="2"/>
  <rect x="34" y="640" width="20" height="16" rx="3" fill="none" stroke="#e2e6ee" stroke-width="2"/>
  <path d="M34 646 h20 M44 640 v-3" stroke="#e2e6ee" stroke-width="2"/>
  <rect x="54" y="630" width="30" height="16" rx="4" fill="#131c2c" stroke="#4a5568"/>
  <text x="69" y="642" font-size="10" fill="#c9ced9" text-anchor="middle" font-weight="700">Tab</text>
  <text x="44" y="694" font-size="11" fill="#8a93a5" text-anchor="middle">背包</text>

  <!-- 强化入口（圆形 r26 + 菱形图标 + 剩余次数角标） -->
  <circle cx="110" cy="648" r="26" fill="#1d2432" stroke="#e8b33c" stroke-width="2"/>
  <rect x="100" y="638" width="20" height="20" rx="3" fill="none" stroke="#e8b33c" stroke-width="2" transform="rotate(45 110 648)"/>
  <circle cx="128" cy="630" r="10" fill="#e8b33c"/>
  <text x="128" y="634" font-size="11" fill="#131c2c" text-anchor="middle" font-weight="700">2</text>
  <text x="110" y="694" font-size="11" fill="#8a93a5" text-anchor="middle">强化</text>

  <!-- 右下：自动战斗（圆形 r26 + 闪电；开=翡翠绿环） -->
  <circle cx="1216" cy="648" r="26" fill="#1a331f" stroke="#2e7d4f" stroke-width="2.5"/>
  <path d="M1220 634 l-10 16 h7 l-3 12 12 -17 h-7 z" fill="#6bd88a"/>
  <rect x="1226" y="630" width="24" height="16" rx="4" fill="#131c2c" stroke="#4a5568"/>
  <text x="1238" y="642" font-size="10" fill="#c9ced9" text-anchor="middle" font-weight="700">G</text>
  <text x="1216" y="694" font-size="11" fill="#6bd88a" text-anchor="middle">自动战斗 · 开</text>

  <!-- 对比：关态 -->
  <circle cx="1120" cy="648" r="26" fill="#1d2432" stroke="#4a5568" stroke-width="2"/>
  <path d="M1124 634 l-10 16 h7 l-3 12 12 -17 h-7 z" fill="#8a93a5"/>
  <text x="1120" y="694" font-size="11" fill="#8a93a5" text-anchor="middle">自动战斗 · 关</text>

  <!-- 操作提示两行（精简） -->
  <text x="1080" y="588" font-size="13" fill="#8a93a5" text-anchor="end">WASD 移动 · J 攻击 · K 技能</text>
  <text x="1080" y="608" font-size="13" fill="#5d6575" text-anchor="end">按 H 展开全部提示 ▸</text>

  <!-- 标注 -->
  <g opacity="0.55">
    <g stroke="#e8b33c" stroke-width="1" stroke-dasharray="4 3" fill="none">
      <circle cx="44" cy="648" r="26"/><circle cx="1216" cy="648" r="26"/>
    </g>
    <g fill="#e8b33c" font-size="10.5">
      <text x="180" y="642">圆钮 r26 · 形状即图标（v5.0：长条图标+文字钮判差评）</text>
      <text x="180" y="658" fill="#8d95a5">背包 @ (44,648) 箱子+Tab 角标 · 强化 @ (110,648) 菱形+次数角标</text>
      <text x="180" y="674" fill="#8d95a5">自动战斗 @ (1216,648) 闪电+G 角标，开=翡翠绿环 / 关=灰环</text>
    </g>
  </g>

  <!-- 版本注记 -->
  <g opacity="0.9">
    <rect x="64" y="64" width="328" height="82" rx="8" fill="#0d1017" stroke="#2b3240"/>
    <text x="80" y="87" font-size="12" font-weight="700" fill="#e8b33c">B008 · v5.0 定稿（2026-10-27）</text>
    <text x="80" y="106" font-size="11" fill="#8d95a5">v5.0：按钮改圆形纯图标钮；WASD 常驻小字删除（H 键展开）</text>
    <text x="80" y="124" font-size="11" fill="#5d6575">v3.0：背包移左下、自动战斗留右下；提示精简两行</text>
    <text x="80" y="140" font-size="11" fill="#5d6575">旧图（170×32 长条按钮 + 7 段一行提示）作废</text>
  </g>
  <text x="1248" y="708" font-size="11" fill="#5d6575" text-anchor="end">A002-UI层-SVG文档-战斗 / B008-暂停与操作提示 / v5.0</text>
</svg>
