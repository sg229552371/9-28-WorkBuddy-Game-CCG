<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <title>B001 顶部进度条 · v5.0 定稿（顶部合并文案一行 + 底部全宽共享经验条，同步总图 v5.0）</title>
  <defs>
    <linearGradient id="b1xp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d9fd6"/><stop offset="1" stop-color="#7fd8ef"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#10151d"/>

  <!-- 战场示意（压暗） -->
  <g opacity="0.18">
    <rect x="0" y="0" width="1280" height="720" fill="#1a2230"/>
    <circle cx="640" cy="380" r="16" fill="#e2e6ee"/>
    <circle cx="500" cy="300" r="9" fill="#e0a3a3"/><circle cx="820" cy="450" r="9" fill="#e0a3a3"/>
  </g>

  <!-- Z1 顶部合并文案（唯一出处：击败/波次/倒计时） -->
  <text x="640" y="34" font-size="17" fill="#c9ced9" text-anchor="middle" letter-spacing="1">击败 32/60　·　波次 5　·　剩余 96s</text>
  <g stroke="#e8b33c" stroke-width="1" stroke-dasharray="4 3" fill="none" opacity="0.5"><rect x="470" y="18" width="340" height="26"/></g>
  <text x="820" y="36" font-size="10.5" fill="#8d95a5" opacity="0.8">← 一行合并文案（17 号）</text>

  <!-- Z7 事件 Banner（顶栏正下） -->
  <rect x="440" y="48" width="400" height="30" rx="6" fill="#2e2620" stroke="#e8b33c" stroke-width="1.2"/>
  <text x="640" y="68" font-size="15" fill="#e8b33c" text-anchor="middle">✦ 撤离点已开启 · 站圈读条提取 ✦</text>

  <!-- Z9 底部全宽共享经验条（三人合并，唯一出处） -->
  <rect x="16" y="697" width="52" height="17" rx="8" fill="#131c2c" stroke="#7fd8ef" stroke-width="1.2"/>
  <text x="42" y="709" font-size="11" fill="#7fd8ef" text-anchor="middle" font-weight="700">Lv 12</text>
  <rect x="78" y="701" width="1186" height="11" rx="5.5" fill="#1d2432" stroke="#2b3240"/>
  <rect x="78" y="701" width="735" height="11" rx="5.5" fill="url(#b1xp)"/>
  <rect x="78" y="701" width="735" height="3" rx="1.5" fill="#bff2ff" opacity="0.55"/>
  <g stroke="#0f1520" stroke-width="1" opacity="0.6">
    <path d="M196 701 v11 M314 701 v11 M432 701 v11 M550 701 v11 M668 701 v11 M786 701 v11"/>
  </g>

  <!-- 标注层 -->
  <g opacity="0.55">
    <g stroke="#e8b33c" stroke-width="1" stroke-dasharray="4 3" fill="none">
      <rect x="16" y="694" width="1248" height="21"/>
      <rect x="16" y="695" width="54" height="20"/>
    </g>
    <g fill="#e8b33c" font-size="10.5">
      <text x="1100" y="690">经验条 1186 × 11 @ (78,701) · 冰蓝渐变</text>
      <text x="1100" y="676" fill="#8d95a5">Lv 徽章 52 × 17 @ (16,697)</text>
    </g>
  </g>

  <!-- 版本注记 -->
  <g opacity="0.9">
    <rect x="920" y="32" width="328" height="82" rx="8" fill="#0d1017" stroke="#2b3240"/>
    <text x="936" y="55" font-size="12" font-weight="700" fill="#e8b33c">B001 · v5.0 定稿（2026-10-27）</text>
    <text x="936" y="74" font-size="11" fill="#8d95a5">v3.0 参考 VS：三人经验共享 → 全宽经验条落屏幕最底</text>
    <text x="936" y="92" font-size="11" fill="#5d6575">v5.0：顶部只留合并文案；Lv/波次/倒计时全屏唯一出处</text>
    <text x="936" y="108" font-size="11" fill="#5d6575">旧图（640×14 顶部进度条 + READY）作废</text>
  </g>
  <text x="1248" y="666" font-size="11" fill="#5d6575" text-anchor="end">A002-UI层-SVG文档-战斗 / B001-顶部进度条 / v5.0</text>
</svg>
