<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <title>B007 撤离点 · v5.0 定稿（提示从左中青字移到 Z7 事件 Banner；金圈 + 读条逻辑不变）</title>
  <rect width="1280" height="720" fill="#10151d"/>

  <!-- 战场（示意，不压暗：撤离点是战场内物件） -->
  <rect x="0" y="96" width="1280" height="624" fill="#161d29" opacity="0.6"/>
  <g opacity="0.35" stroke="#233047"><path d="M0 240 H1280 M0 384 H1280 M0 528 H1280 M320 96 V720 M640 96 V720 M960 96 V720"/></g>

  <!-- Z7 事件 Banner（唯一提示出处） -->
  <rect x="440" y="48" width="400" height="30" rx="6" fill="#2e2620" stroke="#e8b33c" stroke-width="1.2"/>
  <text x="640" y="68" font-size="15" fill="#e8b33c" text-anchor="middle">✦ 撤离点已开启 · 站圈读条提取 ✦</text>

  <!-- 金圈 + 读条 -->
  <circle cx="900" cy="400" r="70" fill="#e8b33c" opacity="0.08"/>
  <circle cx="900" cy="400" r="70" fill="none" stroke="#e8b33c" stroke-width="2" stroke-dasharray="10 6"/>
  <path d="M900 330 A70 70 0 0 1 963 435" fill="none" stroke="#e8b33c" stroke-width="4" stroke-linecap="round"/>
  <text x="900" y="500" font-size="14" fill="#e8b33c" text-anchor="middle">读条 3.2s / 8s</text>
  <!-- 玩家 -->
  <circle cx="880" cy="390" r="10" fill="#e2e6ee"/>
  <rect x="862" y="368" width="36" height="5" rx="2.5" fill="#1d2432"/>
  <rect x="862" y="368" width="20" height="5" rx="2.5" fill="#7fd8ef"/>
  <!-- 队友 -->
  <circle cx="1000" cy="470" r="9" fill="#8a93a5"/>

  <!-- 标注 -->
  <g opacity="0.55">
    <g stroke="#e8b33c" stroke-width="1" stroke-dasharray="4 3" fill="none">
      <rect x="440" y="48" width="400" height="30"/>
    </g>
    <g fill="#e8b33c" font-size="10.5">
      <text x="850" y="64">Banner 400 × 30 @ (440,48)，金底</text>
      <text x="850" y="80" fill="#8d95a5">v5.0 由 (440,60) 上移至 y=48（顶部留白调整）</text>
    </g>
    <text x="760" y="560" font-size="10.5" fill="#8d95a5">金圈 r70 虚线 + 读条弧 + 头顶读条（逻辑不变）</text>
  </g>

  <!-- 版本注记 -->
  <g opacity="0.9">
    <rect x="64" y="120" width="328" height="82" rx="8" fill="#0d1017" stroke="#2b3240"/>
    <text x="80" y="143" font-size="12" font-weight="700" fill="#e8b33c">B007 · v5.0 定稿（2026-10-27）</text>
    <text x="80" y="162" font-size="11" fill="#8d95a5">v2.0：撤离提示从「左中青字」移到 Z7 事件 Banner（顶栏正下，视线不动就能看到）</text>
    <text x="80" y="180" font-size="11" fill="#5d6575">撤离/冻结提示唯一出处；金圈与读条规则不变</text>
    <text x="80" y="196" font-size="11" fill="#5d6575">旧图（左中青字提示）作废</text>
  </g>
  <text x="1248" y="708" font-size="11" fill="#5d6575" text-anchor="end">A002-UI层-SVG文档-战斗 / B007-撤离点 / v5.0</text>
</svg>
