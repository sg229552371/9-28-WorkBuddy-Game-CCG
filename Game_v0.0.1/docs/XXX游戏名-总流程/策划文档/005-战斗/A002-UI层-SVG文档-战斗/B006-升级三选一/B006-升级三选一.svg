<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <title>B006 升级面板（4 选 1）· v5.0 定稿（卡片式 v4.0：4 竖卡并排 + 类别顶带/宝石座/星级/数值高亮/归属徽章；v5.0：可关闭可点击 + HUD 入口按钮）</title>
  <defs>
    <linearGradient id="b6gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c257"/><stop offset="1" stop-color="#dcac33"/>
    </linearGradient>
  </defs>

  <!-- 战场压暗 45% -->
  <rect width="1280" height="720" fill="#131c2c"/>
  <g opacity="0.2">
    <circle cx="640" cy="400" r="14" fill="#e2e6ee"/>
    <circle cx="480" cy="320" r="8" fill="#e0a3a3"/><circle cx="830" cy="470" r="8" fill="#e0a3a3"/>
  </g>
  <rect width="1280" height="720" fill="#000000" opacity="0.45"/>

  <!-- HUD 强化入口按钮（左下，v5.0 新增：点它打开本面板） -->
  <circle cx="110" cy="648" r="26" fill="#1d2432" stroke="#e8b33c" stroke-width="2"/>
  <rect x="100" y="638" width="20" height="20" rx="3" fill="none" stroke="#e8b33c" stroke-width="2" transform="rotate(45 110 648)"/>
  <circle cx="128" cy="630" r="10" fill="#e8b33c"/>
  <text x="128" y="634" font-size="11" fill="#131c2c" text-anchor="middle" font-weight="700">2</text>
  <text x="110" y="694" font-size="11" fill="#8a93a5" text-anchor="middle">强化 (剩 2 次)</text>

  <!-- 面板 900×560 @ (190,76) 金描边 -->
  <rect x="190" y="76" width="900" height="560" rx="14" fill="#181f2c" stroke="#e8b33c" stroke-width="2"/>
  <rect x="196" y="82" width="888" height="548" rx="11" fill="none" stroke="#e8b33c" stroke-width="0.8" opacity="0.4"/>

  <!-- 标题 + 装饰线 -->
  <text x="640" y="126" font-size="26" fill="#e8b33c" text-anchor="middle" font-weight="800" letter-spacing="6">✦ 选择一项强化 ✦</text>
  <path d="M420 142 h180 M680 142 h180" stroke="#e8b33c" stroke-width="1" opacity="0.4"/>

  <!-- ✕ 关闭钮（v5.0：与 Esc 同效，次数保留） -->
  <circle cx="1058" cy="104" r="14" fill="#1d2432" stroke="#5a6575" stroke-width="1.5"/>
  <text x="1058" y="109" font-size="13" fill="#8a93a5" text-anchor="middle">✕</text>

  <!-- 卡1 输出（红顶带） -->
  <g>
    <rect x="216" y="152" width="200" height="320" rx="10" fill="#1c2230" stroke="#4a5568"/>
    <path d="M216 162 a10 10 0 0 1 10 -10 h180 a10 10 0 0 1 10 10 v20 h-200 z" fill="#ff6b6b"/>
    <text x="316" y="176" font-size="13" fill="#131c2c" text-anchor="middle" font-weight="700">输 出</text>
    <rect x="288" y="204" width="56" height="56" rx="8" fill="#232a38" stroke="#ff6b6b" stroke-width="1.5" transform="rotate(45 316 232)"/>
    <text x="316" y="240" font-size="22" fill="#ff9c9c" text-anchor="middle" font-weight="700">⚔</text>
    <rect x="386" y="200" width="24" height="16" rx="8" fill="#ff6b6b"/>
    <text x="398" y="212" font-size="10" fill="#131c2c" text-anchor="middle" font-weight="700">+1</text>
    <text x="316" y="300" font-size="20" fill="#ffe073" text-anchor="middle" font-weight="700">★ ★ ★ ☆ ☆</text>
    <text x="316" y="336" font-size="13" fill="#c9ced9" text-anchor="middle">生命 <tspan fill="#8cd99a" font-weight="700">+15</tspan></text>
    <text x="316" y="358" font-size="13" fill="#c9ced9" text-anchor="middle">攻击 <tspan fill="#8cd99a" font-weight="700">+3</tspan></text>
    <circle cx="316" cy="418" r="12" fill="#252e40" stroke="#4a5568"/>
    <text x="316" y="422" font-size="9" fill="#8a93a5" text-anchor="middle">英</text>
  </g>

  <!-- 卡2 全局（金顶带，选中态金描边） -->
  <g>
    <rect x="432" y="152" width="200" height="320" rx="10" fill="#1c2230" stroke="#e8b33c" stroke-width="1.8"/>
    <path d="M432 162 a10 10 0 0 1 10 -10 h180 a10 10 0 0 1 10 10 v20 h-200 z" fill="#ffd140"/>
    <text x="532" y="176" font-size="13" fill="#131c2c" text-anchor="middle" font-weight="700">全 局</text>
    <rect x="504" y="204" width="56" height="56" rx="8" fill="#232a38" stroke="#ffd140" stroke-width="1.5" transform="rotate(45 532 232)"/>
    <text x="532" y="240" font-size="22" fill="#ffe073" text-anchor="middle" font-weight="700">✦</text>
    <rect x="602" y="200" width="24" height="16" rx="8" fill="#ffd140"/>
    <text x="614" y="212" font-size="10" fill="#131c2c" text-anchor="middle" font-weight="700">+2</text>
    <text x="532" y="300" font-size="20" fill="#ffe073" text-anchor="middle" font-weight="700">★ ★ ☆ ☆ ☆</text>
    <text x="532" y="336" font-size="13" fill="#c9ced9" text-anchor="middle">移速 <tspan fill="#8cd99a" font-weight="700">+8%</tspan></text>
    <text x="532" y="358" font-size="13" fill="#c9ced9" text-anchor="middle">负重上限 <tspan fill="#8cd99a" font-weight="700">+20</tspan></text>
    <rect x="500" y="404" width="64" height="26" rx="13" fill="#2e2620" stroke="#e8b33c" stroke-width="1"/>
    <text x="532" y="421" font-size="12" fill="#e8b33c" text-anchor="middle">全 局</text>
  </g>

  <!-- 卡3 防御（蓝顶带） -->
  <g>
    <rect x="648" y="152" width="200" height="320" rx="10" fill="#1c2230" stroke="#4a5568"/>
    <path d="M648 162 a10 10 0 0 1 10 -10 h180 a10 10 0 0 1 10 10 v20 h-200 z" fill="#6cb2ff"/>
    <text x="748" y="176" font-size="13" fill="#131c2c" text-anchor="middle" font-weight="700">防 御</text>
    <rect x="720" y="204" width="56" height="56" rx="8" fill="#232a38" stroke="#6cb2ff" stroke-width="1.5" transform="rotate(45 748 232)"/>
    <text x="748" y="240" font-size="22" fill="#9cc9ff" text-anchor="middle" font-weight="700">🛡</text>
    <rect x="818" y="200" width="24" height="16" rx="8" fill="#6cb2ff"/>
    <text x="830" y="212" font-size="10" fill="#131c2c" text-anchor="middle" font-weight="700">+1</text>
    <text x="748" y="300" font-size="20" fill="#ffe073" text-anchor="middle" font-weight="700">★ ☆ ☆ ☆ ☆</text>
    <text x="748" y="336" font-size="13" fill="#c9ced9" text-anchor="middle">受到伤害 <tspan fill="#ff8a84" font-weight="700">-10%</tspan></text>
    <text x="748" y="358" font-size="13" fill="#c9ced9" text-anchor="middle">击退 <tspan fill="#8cd99a" font-weight="700">+15%</tspan></text>
    <circle cx="748" cy="418" r="12" fill="#252e40" stroke="#4a5568"/>
    <text x="748" y="422" font-size="9" fill="#8a93a5" text-anchor="middle">英</text>
  </g>

  <!-- 卡4 辅助（绿顶带） -->
  <g>
    <rect x="864" y="152" width="200" height="320" rx="10" fill="#1c2230" stroke="#4a5568"/>
    <path d="M864 162 a10 10 0 0 1 10 -10 h180 a10 10 0 0 1 10 10 v20 h-200 z" fill="#6bd88a"/>
    <text x="964" y="176" font-size="13" fill="#131c2c" text-anchor="middle" font-weight="700">辅 助</text>
    <rect x="936" y="204" width="56" height="56" rx="8" fill="#232a38" stroke="#6bd88a" stroke-width="1.5" transform="rotate(45 964 232)"/>
    <text x="964" y="240" font-size="22" fill="#a5e8bc" text-anchor="middle" font-weight="700">➶</text>
    <rect x="1034" y="200" width="24" height="16" rx="8" fill="#6bd88a"/>
    <text x="1046" y="212" font-size="10" fill="#131c2c" text-anchor="middle" font-weight="700">+1</text>
    <text x="964" y="300" font-size="20" fill="#ffe073" text-anchor="middle" font-weight="700">★ ★ ☆ ☆ ☆</text>
    <text x="964" y="336" font-size="13" fill="#c9ced9" text-anchor="middle">技能冷却 <tspan fill="#ff8a84" font-weight="700">-8%</tspan></text>
    <text x="964" y="358" font-size="13" fill="#c9ced9" text-anchor="middle">拾取范围 <tspan fill="#8cd99a" font-weight="700">+20%</tspan></text>
    <circle cx="964" cy="418" r="12" fill="#252e40" stroke="#4a5568"/>
    <text x="964" y="422" font-size="9" fill="#8a93a5" text-anchor="middle">英</text>
  </g>

  <!-- 刷新按钮 + 次数角标（v5.0：底部两行小字删除，次数并入角标） -->
  <rect x="540" y="512" width="200" height="46" rx="10" fill="#232a38" stroke="#3a4150" stroke-width="1.5"/>
  <text x="628" y="541" font-size="16" fill="#e2e6ee" text-anchor="middle">⟳ 刷 新 (R)</text>
  <circle cx="744" cy="504" r="12" fill="#e8b33c"/>
  <text x="744" y="509" font-size="11" fill="#131c2c" text-anchor="middle" font-weight="700">3</text>

  <!-- 标注 -->
  <g opacity="0.6">
    <g stroke="#e8b33c" stroke-width="1" stroke-dasharray="4 3" fill="none">
      <rect x="190" y="76" width="900" height="560"/>
      <rect x="216" y="152" width="200" height="320"/>
    </g>
    <g fill="#e8b33c" font-size="10.5">
      <text x="1116" y="92">面板 900 × 560 @ (190,76) + 45% 黑幕</text>
      <text x="1116" y="108" fill="#8d95a5">4 卡 200 × 320 · 间距 16 · 顶带 30 类别色</text>
      <text x="1116" y="124" fill="#8d95a5">宝石座 56 rotate45 · 数值高亮：增益绿/负面红</text>
      <text x="1116" y="140" fill="#8d95a5">归属徽章：英雄头像圆 / 「全局」胶囊</text>
      <text x="1116" y="156" fill="#8d95a5">✕/Esc 可关 · 卡片可点击 · 不再强制选一项</text>
    </g>
  </g>

  <!-- 版本注记 -->
  <text x="640" y="700" font-size="12" fill="#5d6575" text-anchor="middle">B006 · v5.0 定稿（2026-10-27）：v4.0 卡片式（参考太奶奶提供的手游技能选择截图）+ v5.0 可关闭可点击 + HUD 强化入口按钮 · 旧图（800×400 横条 4 选 1）作废　│　A002-UI层-SVG文档-战斗 / B006-升级三选一 / v5.0</text>
</svg>
