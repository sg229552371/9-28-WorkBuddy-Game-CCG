<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <title>006-结算 · 两套界面总图（成功 / 失败 · v2.0）</title>

  <defs>
    <linearGradient id="stlBg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#131c2c"/>
      <stop offset="0.55" stop-color="#101725"/>
      <stop offset="1" stop-color="#0b1119"/>
    </linearGradient>
    <linearGradient id="stlPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#212630"/>
      <stop offset="1" stop-color="#1b1f27"/>
    </linearGradient>
    <linearGradient id="stlGoldBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c257"/>
      <stop offset="1" stop-color="#dcac33"/>
    </linearGradient>
    <filter id="stlShadow" x="-30%" y="-60%" width="160%" height="240%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="stlShadowBig" x="-30%" y="-60%" width="160%" height="240%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- ============ L0 背景 ============ -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#stlBg)"/>

  <!-- ============ L1 页头 ============ -->
  <text x="32" y="44" font-size="20" font-weight="700" fill="#e8b33c">006-结算 · 两套界面：成功 / 失败</text>
  <text x="32" y="68" font-size="12" fill="#8a93a5">设计定稿（2026-10-27）：一套全局结算屏 × 两种状态；每套实际铺满 1280×720 整屏，此处并排示意（非 1:1）</text>

  <!-- ============ L2 界面 A：成功结算 ============ -->
  <g filter="url(#stlShadowBig)">
    <rect x="60" y="96" width="540" height="560" rx="10" fill="url(#stlPanel)" stroke="#2e4a36" stroke-width="2"/>
  </g>
  <rect x="60" y="96" width="540" height="30" rx="10" fill="#2e4a36"/>
  <rect x="60" y="116" width="540" height="10" fill="#2e4a36"/>
  <text x="76" y="117" font-size="13" font-weight="700" fill="#9fe0af">界面 A · 成功结算（撤离成功）</text>

  <text x="92" y="168" font-size="26" font-weight="700" fill="#e8b33c">战斗结算</text>
  <line x1="92" y1="184" x2="568" y2="184" stroke="#2a2f3a" stroke-width="1"/>

  <!-- 胜负大字：绿 -->
  <rect x="92" y="206" width="220" height="46" rx="8" fill="#2e4a36"/>
  <text x="202" y="237" font-size="24" font-weight="700" fill="#9fe0af" text-anchor="middle">撤离成功！</text>

  <!-- 数据行 -->
  <text x="92" y="290" font-size="16" fill="#e2e6ee">击杀 128 <tspan fill="#5a6572">·</tspan> 用时 04:35 <tspan fill="#5a6572">·</tspan> 拾取 12 件</text>

  <!-- 收益行 -->
  <text x="92" y="324" font-size="16" font-weight="700" fill="#e8b33c">本关评级 ★★☆ <tspan fill="#b8892f">·</tspan> 结晶收益 ◆340</text>
  <text x="92" y="350" font-size="14" fill="#9fe0af">✓ 已解锁：第 4 关（新关卡开启）</text>

  <!-- 战利品 -->
  <text x="92" y="392" font-size="15" fill="#e2e6ee">战利品</text>
  <g font-size="14" fill="#8a93a5">
    <text x="92" y="420"><tspan fill="#c9ced9">生锈的匕首</tspan><tspan fill="#5a6572">·白</tspan></text>
    <text x="92" y="446"><tspan fill="#6fa8e0">火焰水晶</tspan><tspan fill="#5a6572">·蓝</tspan></text>
    <text x="92" y="472"><tspan fill="#e8b33c">巨兽的犬齿</tspan><tspan fill="#5a6572">·金</tspan></text>
  </g>
  <g>
    <circle cx="340" cy="415" r="4" fill="#c9ced9"/>
    <circle cx="340" cy="441" r="4" fill="#6fa8e0"/>
    <circle cx="340" cy="467" r="4" fill="#e8b33c"/>
  </g>

  <!-- 按钮 -->
  <g filter="url(#stlShadow)">
    <rect x="92" y="520" width="320" height="52" rx="8" fill="url(#stlGoldBtn)"/>
  </g>
  <text x="252" y="554" font-size="19" font-weight="700" fill="#131c2c" text-anchor="middle">返回主城</text>
  <rect x="92" y="584" width="320" height="52" rx="8" fill="#252a34" stroke="#3a4150" stroke-width="1.5"/>
  <text x="252" y="618" font-size="19" fill="#e2e6ee" text-anchor="middle">回主菜单</text>

  <!-- ============ L3 界面 B：失败结算 ============ -->
  <g filter="url(#stlShadowBig)">
    <rect x="680" y="96" width="540" height="560" rx="10" fill="url(#stlPanel)" stroke="#4a2e2e" stroke-width="2"/>
  </g>
  <rect x="680" y="96" width="540" height="30" rx="10" fill="#4a2e2e"/>
  <rect x="680" y="116" width="540" height="10" fill="#4a2e2e"/>
  <text x="696" y="117" font-size="13" font-weight="700" fill="#e0a3a3">界面 B · 失败结算（不幸阵亡）</text>

  <text x="712" y="168" font-size="26" font-weight="700" fill="#e8b33c">战斗结算</text>
  <line x1="712" y1="184" x2="1188" y2="184" stroke="#2a2f3a" stroke-width="1"/>

  <!-- 胜负大字：红 -->
  <rect x="712" y="206" width="220" height="46" rx="8" fill="#4a2e2e"/>
  <text x="822" y="237" font-size="24" font-weight="700" fill="#e0a3a3" text-anchor="middle">不幸阵亡…</text>

  <!-- 数据行 -->
  <text x="712" y="290" font-size="16" fill="#e2e6ee">击杀 37 <tspan fill="#5a6572">·</tspan> 用时 02:18 <tspan fill="#5a6572">·</tspan> 拾取 5 件</text>

  <!-- 收益行（失败口径，两条） -->
  <text x="712" y="324" font-size="16" font-weight="700" fill="#e0a3a3">本局收获：全部丢失</text>
  <text x="712" y="350" font-size="14" fill="#8a93a5">击杀辛苦钱 ◆11 已入账（按 30% 折算）· 局外等级保住</text>

  <!-- 战利品（失败无清单） -->
  <text x="712" y="392" font-size="15" fill="#e2e6ee">战利品</text>
  <text x="712" y="420" font-size="14" fill="#5a6572">本局收获未带出 · 全数遗失</text>

  <!-- 按钮 -->
  <g filter="url(#stlShadow)">
    <rect x="712" y="520" width="320" height="52" rx="8" fill="url(#stlGoldBtn)"/>
  </g>
  <text x="872" y="554" font-size="19" font-weight="700" fill="#131c2c" text-anchor="middle">返回主城</text>
  <rect x="712" y="584" width="320" height="52" rx="8" fill="#252a34" stroke="#3a4150" stroke-width="1.5"/>
  <text x="872" y="618" font-size="19" fill="#e2e6ee" text-anchor="middle">回主菜单</text>

  <!-- ============ L4 中缝差异标注 ============ -->
  <g>
    <path d="M640 96 L640 656" stroke="#3a4150" stroke-width="1" stroke-dasharray="6 5"/>
    <g font-size="11" fill="#8a93a5">
      <text x="640" y="230" text-anchor="middle" fill="#9fe0af">绿 ← 胜负大字 → 红</text>
      <text x="640" y="324" text-anchor="middle">全额收益 ← 收益行 → 全丢+三成</text>
      <text x="640" y="350" text-anchor="middle">有解锁行 ← 差异 → 无解锁行</text>
      <text x="640" y="440" text-anchor="middle">品质清单 ← 战利品 → 遗失说明</text>
      <text x="640" y="560" text-anchor="middle" fill="#e8b33c">按钮两套一致</text>
    </g>
  </g>

  <!-- ============ L5 底部说明 ============ -->
  <g>
    <rect x="32" y="668" width="760" height="40" rx="8" fill="#0d1017" stroke="#2b3240"/>
    <text x="48" y="686" font-size="11" fill="#8a93a5">规格速查：面板底 #1d2027　标题 30 金　胜负大字 24 号（成功 #9fe0af / 失败 #e0a3a3，底 #2e4a36 / #4a2e2e）</text>
    <text x="48" y="702" font-size="11" fill="#8a93a5">正文 16 #e2e6ee　清单 #8a93a5　按钮 320×52 rx8（金 #e8b33c / 灰 #252a34）　色值均来自代码常量，未新增颜色</text>
  </g>
  <g>
    <rect x="812" y="668" width="436" height="40" rx="8" fill="#12181f" stroke="#e8b33c" stroke-width="1"/>
    <text x="828" y="686" font-size="11" font-weight="700" fill="#e8b33c">v2.0 变更（2026-10-27 反馈）</text>
    <text x="828" y="702" font-size="11" fill="#e2e6ee">由单张胜利图改为成功/失败两套界面；代码板子甲/乙合并仍是待办 T1</text>
  </g>

  <text x="1248" y="714" font-size="11" fill="#5d6575" text-anchor="end">A002-UI层-结算总SVG文档 / 1280×720 / v2.0 两套界面</text>
</svg>
