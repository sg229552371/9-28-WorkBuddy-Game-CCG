<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <title>B002-本局数据 · v3.0 定稿（左标签右数值两栏大字，替代旧三段式挤行）</title>
  <rect width="1280" height="720" fill="#10151d"/>
  <g opacity="0.12"><rect width="1280" height="720" fill="#1a2230"/></g>

  <!-- 数据区样例（结算面板内，居中列） -->
  <g>
    <!-- 行1 挑战到达 -->
    <text x="470" y="150" font-size="15" fill="#8a93a5" text-anchor="end">挑战到达</text>
    <text x="510" y="154" font-size="24" fill="#e2e6ee" font-weight="800">第 3 关</text>
    <path d="M380 172 H900" stroke="#2b3240"/>

    <!-- 行2 用时 / 击杀 两列 -->
    <text x="470" y="222" font-size="15" fill="#8a93a5" text-anchor="end">用时</text>
    <text x="510" y="226" font-size="19" fill="#e2e6ee" font-weight="700">06:42</text>
    <text x="680" y="222" font-size="15" fill="#8a93a5" text-anchor="end">击杀</text>
    <text x="720" y="226" font-size="19" fill="#e2e6ee" font-weight="700">412</text>
    <path d="M380 244 H900" stroke="#2b3240"/>

    <!-- 行3 拾取 -->
    <text x="470" y="292" font-size="15" fill="#8a93a5" text-anchor="end">拾取</text>
    <text x="510" y="296" font-size="19" fill="#e2e6ee" font-weight="700">38 件</text>
    <path d="M380 314 H900" stroke="#2b3240"/>
  </g>

  <!-- 标注 -->
  <g opacity="0.6">
    <g stroke="#e8b33c" stroke-width="1" stroke-dasharray="4 3" fill="none">
      <rect x="360" y="120" width="560" height="210"/>
    </g>
    <g fill="#e8b33c" font-size="10.5">
      <text x="930" y="140">标签 15 号灰 · 右对齐（锚 x=470/680）</text>
      <text x="930" y="156" fill="#8d95a5">数值 19~24 号白 · 左对齐（锚 x=510/720）</text>
      <text x="930" y="172" fill="#8d95a5">行距分隔线 #2b3240</text>
      <text x="930" y="188" fill="#8d95a5">「挑战到达」为关键行，数值最大 24 号</text>
    </g>
  </g>

  <!-- 新旧对照 + 注记 -->
  <g opacity="0.9">
    <rect x="200" y="400" width="880" height="120" rx="10" fill="#0d1017" stroke="#2b3240"/>
    <text x="224" y="432" font-size="13" font-weight="700" fill="#e8b33c">v3.0 变更（2026-10-27，同步总图 v3.0）</text>
    <text x="224" y="460" font-size="12.5" fill="#8d95a5">· 旧「三段式」一行挤 3 个数据 → 改左标签右数值两栏，逐行分隔，一眼一行</text>
    <text x="224" y="482" font-size="12.5" fill="#8d95a5">· 关键数据（到达关卡）24 号特大白字，次要数据 19 号</text>
    <text x="224" y="504" font-size="12.5" fill="#5d6575">· 结晶收益行独立成 B003（v3.0 单列 24 号金色）</text>
  </g>
  <text x="1248" y="708" font-size="11" fill="#5d6575" text-anchor="end">A002-UI层-SVG文档-结算 / B002-本局数据 / v3.0 · 旧「三段式」图作废</text>
</svg>
