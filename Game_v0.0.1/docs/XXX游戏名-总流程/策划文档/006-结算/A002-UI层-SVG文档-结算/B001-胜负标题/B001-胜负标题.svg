<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <title>B001-胜负标题 · v3.0 定稿（胜负标题升格菱形徽章：双层描边 + 发光晕；同步总图 v3.0）</title>
  <rect width="1280" height="720" fill="#10151d"/>
  <g opacity="0.12"><rect width="1280" height="720" fill="#1a2230"/></g>

  <!-- ===== 左：成功（金徽章） ===== -->
  <text x="320" y="60" font-size="14" font-weight="700" fill="#9fe0af">状态 A · 撤离成功（won = true）</text>
  <g>
    <circle cx="320" cy="240" r="118" fill="#ffd140" opacity="0.07"/>
    <g transform="rotate(45 320 240)">
      <rect x="260" y="180" width="120" height="120" rx="10" fill="#2e2620" stroke="#ffd140" stroke-width="3"/>
      <rect x="270" y="190" width="100" height="100" rx="7" fill="none" stroke="#ffd140" stroke-width="1" opacity="0.55"/>
    </g>
    <text x="320" y="236" font-size="34" fill="#ffd140" text-anchor="middle" font-weight="800" letter-spacing="6">战斗胜利</text>
    <text x="320" y="272" font-size="14" fill="#e8b33c" text-anchor="middle" letter-spacing="8" opacity="0.85">VICTORY</text>
    <path d="M250 300 h140" stroke="#ffd140" stroke-width="1" opacity="0.4"/>
  </g>
  <g opacity="0.6">
    <g stroke="#e8b33c" stroke-width="1" stroke-dasharray="4 3" fill="none"><rect x="258" y="178" width="124" height="124" transform="rotate(45 320 240)"/></g>
    <text x="452" y="200" font-size="10.5" fill="#e8b33c">徽章 120 × 120 · rotate45</text>
    <text x="452" y="216" fill="#8d95a5">双层描边 + 外发光晕 r118</text>
    <text x="452" y="232" fill="#8d95a5">大字 34 号 + VICTORY 小字</text>
  </g>

  <!-- ===== 右：失败（红徽章） ===== -->
  <text x="960" y="60" font-size="14" font-weight="700" fill="#e0a3a3">状态 B · 不幸阵亡（won = false）</text>
  <g>
    <circle cx="960" cy="240" r="118" fill="#e0a3a3" opacity="0.06"/>
    <g transform="rotate(45 960 240)">
      <rect x="900" y="180" width="120" height="120" rx="10" fill="#3a2222" stroke="#e0a3a3" stroke-width="3"/>
      <rect x="910" y="190" width="100" height="100" rx="7" fill="none" stroke="#e0a3a3" stroke-width="1" opacity="0.55"/>
    </g>
    <text x="960" y="236" font-size="34" fill="#e0a3a3" text-anchor="middle" font-weight="800" letter-spacing="6">不幸阵亡</text>
    <text x="960" y="272" font-size="14" fill="#e0a3a3" text-anchor="middle" letter-spacing="8" opacity="0.85">DEFEAT</text>
    <path d="M890 300 h140" stroke="#e0a3a3" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- 旧方案作废说明 -->
  <g opacity="0.9">
    <rect x="200" y="420" width="880" height="120" rx="10" fill="#0d1017" stroke="#2b3240"/>
    <text x="224" y="452" font-size="13" font-weight="700" fill="#e8b33c">v3.0 变更（2026-10-27，同步总图 v3.0）</text>
    <text x="224" y="480" font-size="12.5" fill="#8d95a5">· 胜负标题从「32 号文字大字」升格为菱形徽章（仪式感对标参考图）</text>
    <text x="224" y="502" font-size="12.5" fill="#8d95a5">· C3 定稿：只留一套全局结算屏（战斗内小板删除）——「赢了也写阵亡」随板子甲一起消灭</text>
    <text x="224" y="524" font-size="12.5" fill="#5d6575">· 配色沿用代码闲置常量：金 #ffd140 / 红 #e0a3a3（未新增颜色）</text>
  </g>
  <text x="1248" y="708" font-size="11" fill="#5d6575" text-anchor="end">A002-UI层-SVG文档-结算 / B001-胜负标题 / v3.0 · 旧「两版并排文字大字」图作废</text>
</svg>
