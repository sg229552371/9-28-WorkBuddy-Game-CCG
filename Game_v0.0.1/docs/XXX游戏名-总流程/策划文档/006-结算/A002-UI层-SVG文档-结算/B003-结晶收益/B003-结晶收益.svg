<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <title>B003-结晶收益 · v3.0 定稿（关卡评价星级金色 + 获得结晶 24 号金特大 + 已解锁绿注；失败态 30% 折算）</title>
  <rect width="1280" height="720" fill="#10151d"/>
  <g opacity="0.12"><rect width="1280" height="720" fill="#1a2230"/></g>

  <!-- ===== 左：成功态 ===== -->
  <text x="320" y="60" font-size="14" font-weight="700" fill="#9fe0af">成功态（won = true）</text>
  <g>
    <text x="470" y="150" font-size="15" fill="#8a93a5" text-anchor="end">关卡评价</text>
    <text x="510" y="153" font-size="20" fill="#ffd140" font-weight="700">★ ★ ☆</text>
    <text x="636" y="152" font-size="13" fill="#5d6575">（灰星=未得）</text>
    <path d="M380 172 H900" stroke="#2b3240"/>

    <text x="470" y="230" font-size="15" fill="#8a93a5" text-anchor="end">获得结晶</text>
    <text x="510" y="234" font-size="24" fill="#ffd140" font-weight="800">◆ 340</text>
    <text x="640" y="232" font-size="14" fill="#9fe0af">✓ 已解锁 第 4 关</text>
    <path d="M380 252 H900" stroke="#2b3240"/>
  </g>
  <g opacity="0.6">
    <g fill="#e8b33c" font-size="10.5">
      <text x="930" y="140">评价星 20 号金（空星 #5d6575）</text>
      <text x="930" y="156" fill="#8d95a5">结晶 24 号金特大（全屏最大数字之一）</text>
      <text x="930" y="172" fill="#8d95a5">「已解锁」绿注 14 号（#9fe0af，全项目通用成功绿）</text>
    </g>
  </g>

  <!-- ===== 右：失败态 ===== -->
  <text x="960" y="60" font-size="14" font-weight="700" fill="#e0a3a3">失败态（won = false）</text>
  <g>
    <text x="700" y="150" font-size="15" fill="#8a93a5" text-anchor="end">本局收获</text>
    <text x="740" y="153" font-size="18" fill="#e0a3a3" font-weight="700">全部丢失</text>
    <path d="M620 172 H1140" stroke="#2b3240"/>
    <text x="700" y="230" font-size="15" fill="#8a93a5" text-anchor="end">击杀辛苦钱</text>
    <text x="740" y="234" font-size="20" fill="#ffd140" font-weight="700">◆ 72</text>
    <text x="840" y="232" font-size="13" fill="#8d95a5">（按 30% 折算入账）</text>
    <path d="M620 252 H1140" stroke="#2b3240"/>
  </g>

  <!-- 收益规则流程 -->
  <g opacity="0.9">
    <rect x="200" y="330" width="880" height="130" rx="10" fill="#0d1017" stroke="#2b3240"/>
    <text x="224" y="362" font-size="13" font-weight="700" fill="#e8b33c">收益规则（C2 口径）</text>
    <text x="224" y="392" font-size="13" fill="#c9ced9">胜利：结晶收益 ◆全额入账（含星级奖励）＋ 解锁下一关</text>
    <text x="224" y="416" font-size="13" fill="#c9ced9">阵亡：本局收获全部丢失，仅击杀辛苦钱按 <tspan fill="#ff8a84" font-weight="700">30%</tspan> 折算入账（deathRatio=0.3）</text>
    <text x="224" y="440" font-size="12" fill="#5d6575">· v3.0 变更：结晶收益从数据堆里独立成行，24 号金色特大 + 已解锁绿注；旧「胜利版/死亡版并排小面板」作废</text>
  </g>
  <text x="1248" y="708" font-size="11" fill="#5d6575" text-anchor="end">A002-UI层-SVG文档-结算 / B003-结晶收益 / v3.0</text>
</svg>
