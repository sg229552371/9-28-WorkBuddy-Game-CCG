<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <title>B005-返回主城 · v3.0 定稿（成功态双大按钮：返回主城蓝 + 下一关金带倒计时；失败态单大按钮）</title>
  <defs>
    <linearGradient id="b5blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a7ec4"/><stop offset="1" stop-color="#35619c"/>
    </linearGradient>
    <linearGradient id="b5gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c257"/><stop offset="1" stop-color="#dcac33"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#10151d"/>
  <g opacity="0.12"><rect width="1280" height="720" fill="#1a2230"/></g>

  <!-- ===== 左：成功态（双大按钮） ===== -->
  <text x="320" y="70" font-size="14" font-weight="700" fill="#9fe0af">成功态 · 双大按钮</text>
  <g>
    <rect x="120" y="110" width="160" height="50" rx="10" fill="url(#b5blue)" stroke="#7fb0e8" stroke-width="1.2"/>
    <text x="200" y="142" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">返回主城</text>

    <rect x="300" y="106" width="244" height="58" rx="12" fill="url(#b5gold)" stroke="#ffe073" stroke-width="1.5"/>
    <text x="392" y="143" font-size="19" fill="#131c2c" text-anchor="middle" font-weight="800">下一关 ▶</text>
    <text x="486" y="141" font-size="14" fill="#131c2c" opacity="0.75" font-weight="700">00:06</text>
  </g>
  <text x="120" y="196" font-size="12" fill="#8d95a5">倒计时归零自动进下一关；点「返回主城」可取消（T21 待拍板）</text>

  <!-- ===== 右：失败态（单大按钮） ===== -->
  <text x="960" y="70" font-size="14" font-weight="700" fill="#e0a3a3">失败态 · 单大按钮</text>
  <g>
    <rect x="838" y="106" width="244" height="58" rx="12" fill="url(#b5gold)" stroke="#ffe073" stroke-width="1.5"/>
    <text x="960" y="143" font-size="19" fill="#131c2c" text-anchor="middle" font-weight="800">返回主城</text>
  </g>
  <text x="838" y="196" font-size="12" fill="#8d95a5">失败没有「下一关」，只有一条路回城</text>

  <!-- 按钮规格标注 -->
  <g opacity="0.6">
    <g stroke="#e8b33c" stroke-width="1" stroke-dasharray="4 3" fill="none">
      <rect x="300" y="106" width="244" height="58"/>
      <rect x="120" y="110" width="160" height="50"/>
    </g>
    <g fill="#e8b33c" font-size="10.5">
      <text x="560" y="122">下一关 244 × 58（主）· 返回主城 160 × 50（次）</text>
      <text x="560" y="138" fill="#8d95a5">金渐变=主推荐 · 蓝渐变=次选（层级用尺寸+颜色双重拉开）</text>
      <text x="560" y="154" fill="#8d95a5">倒计时数字在按钮内右侧 14 号</text>
    </g>
  </g>

  <!-- 注记 -->
  <g opacity="0.9">
    <rect x="200" y="260" width="880" height="140" rx="10" fill="#0d1017" stroke="#2b3240"/>
    <text x="224" y="292" font-size="13" font-weight="700" fill="#e8b33c">v3.0 变更（2026-10-27，同步总图 v3.0）</text>
    <text x="224" y="320" font-size="12.5" fill="#8d95a5">· 旧「320×52 两颗灰金按钮」→ 双大按钮：返回主城（蓝 160×50）+ 下一关（金 244×58 + 00:06 倒计时）</text>
    <text x="224" y="342" font-size="12.5" fill="#8d95a5">· 失败态只有单个大「返回主城」（金 244×58）</text>
    <text x="224" y="364" font-size="12.5" fill="#5d6575">· 「回主菜单」v3.0 视觉稿未放（T12 继续待拍板）；倒计时自动进关涉及流程锁（T21 待拍板）</text>
    <text x="224" y="386" font-size="12.5" fill="#5d6575">· 快捷键：Enter=主推荐按钮 · Esc=返回主城</text>
  </g>
  <text x="1248" y="708" font-size="11" fill="#5d6575" text-anchor="end">A002-UI层-SVG文档-结算 / B005-返回主城 / v3.0 · 旧「两个按钮+去向流程」图作废</text>
</svg>
