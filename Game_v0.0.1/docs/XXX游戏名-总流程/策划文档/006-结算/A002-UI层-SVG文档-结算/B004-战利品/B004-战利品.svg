<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <title>B004-战利品 · v3.0 定稿（「获得奖励」装饰分隔 + 奖励图标格 64×64 品质描边 + ×N 角标；替代旧灰字清单）</title>
  <rect width="1280" height="720" fill="#10151d"/>
  <g opacity="0.12"><rect width="1280" height="720" fill="#1a2230"/></g>

  <!-- ===== 左：有货版（成功态） ===== -->
  <text x="320" y="60" font-size="14" font-weight="700" fill="#9fe0af">有货版（成功态）</text>

  <!-- 装饰分隔标题 -->
  <path d="M180 108 h96" stroke="#e8b33c" stroke-width="1" opacity="0.15"/>
  <text x="320" y="114" font-size="17" fill="#e8b33c" text-anchor="middle" font-weight="700" letter-spacing="4">✦ 获得奖励 ✦</text>
  <path d="M364 108 h96" stroke="#e8b33c" stroke-width="1" opacity="0.15"/>

  <!-- 图标格 64×64 ×4（品质描边 + ×N 角标） -->
  <g>
    <rect x="176" y="140" width="64" height="64" rx="8" fill="#1c2230" stroke="#c9ced9" stroke-width="2"/>
    <text x="208" y="180" font-size="22" fill="#c9ced9" text-anchor="middle">🗡</text>
    <rect x="222" y="134" width="24" height="16" rx="8" fill="#131c2c" stroke="#c9ced9"/>
    <text x="234" y="146" font-size="10" fill="#c9ced9" text-anchor="middle">×2</text>

    <rect x="256" y="140" width="64" height="64" rx="8" fill="#1c2230" stroke="#6fa8e0" stroke-width="2"/>
    <text x="288" y="180" font-size="22" fill="#6fa8e0" text-anchor="middle">💠</text>
    <rect x="302" y="134" width="24" height="16" rx="8" fill="#131c2c" stroke="#6fa8e0"/>
    <text x="314" y="146" font-size="10" fill="#6fa8e0" text-anchor="middle">×1</text>

    <rect x="336" y="140" width="64" height="64" rx="8" fill="#1c2230" stroke="#a86fe0" stroke-width="2"/>
    <text x="368" y="180" font-size="22" fill="#a86fe0" text-anchor="middle">📿</text>
    <rect x="382" y="134" width="24" height="16" rx="8" fill="#131c2c" stroke="#a86fe0"/>
    <text x="394" y="146" font-size="10" fill="#a86fe0" text-anchor="middle">×3</text>

    <rect x="416" y="140" width="64" height="64" rx="8" fill="#1c2230" stroke="#e8b33c" stroke-width="2"/>
    <text x="448" y="180" font-size="22" fill="#e8b33c" text-anchor="middle">👑</text>
    <rect x="462" y="134" width="24" height="16" rx="8" fill="#131c2c" stroke="#e8b33c"/>
    <text x="474" y="146" font-size="10" fill="#e8b33c" text-anchor="middle">×1</text>
  </g>

  <!-- 品质图例 -->
  <g font-size="11" fill="#8d95a5">
    <text x="176" y="228">白 #c9ced9（普通）</text>
    <text x="308" y="228">蓝 #6fa8e0（稀有）</text>
    <text x="424" y="228">紫 #a86fe0（史诗）</text>
    <text x="540" y="228" fill="#e8b33c">金 #e8b33c（传说）</text>
  </g>

  <!-- ===== 右：空版（失败态） ===== -->
  <text x="960" y="60" font-size="14" font-weight="700" fill="#e0a3a3">空版（失败态）</text>
  <text x="960" y="130" font-size="15" fill="#8d95a5" text-anchor="middle">本局收获未带出 · 全数遗失</text>
  <text x="960" y="156" font-size="12" fill="#5d6575" text-anchor="middle">（不显示图标格，避免玩家看着心塞）</text>

  <!-- 注记 -->
  <g opacity="0.9">
    <rect x="200" y="300" width="880" height="120" rx="10" fill="#0d1017" stroke="#2b3240"/>
    <text x="224" y="332" font-size="13" font-weight="700" fill="#e8b33c">v3.0 变更（2026-10-27，同步总图 v3.0；原 T13 定稿）</text>
    <text x="224" y="360" font-size="12.5" fill="#8d95a5">· 旧「灰字清单」→ 奖励图标格 64×64：品质描边（白/蓝/紫/金）+ 右上角 ×N 数量角标</text>
    <text x="224" y="382" font-size="12.5" fill="#8d95a5">· 上方「✦ 获得奖励 ✦」装饰分隔标题（两侧渐隐线）</text>
    <text x="224" y="404" font-size="12.5" fill="#5d6575">· 品质色与遗物背包品质底色同源，全项目通用</text>
  </g>
  <text x="1248" y="708" font-size="11" fill="#5d6575" text-anchor="end">A002-UI层-SVG文档-结算 / B004-战利品 / v3.0 · 旧「有货版/空版灰字清单」图作废</text>
</svg>
