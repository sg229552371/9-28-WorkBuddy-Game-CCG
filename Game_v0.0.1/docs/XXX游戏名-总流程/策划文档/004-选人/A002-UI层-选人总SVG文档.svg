  <text x="107" y="99" font-size="11" fill="#e8b33c" text-anchor="middle">150</text>
  <text x="1236" y="426" font-size="11" fill="#e8b33c" text-anchor="end">详情面板 190 高 · 圆角 8 · 内边距 12 / 8</text>


  <text x="1248" y="708" font-size="12" fill="#5a6572" text-anchor="end">A002-UI层-选人总SVG文档 / 1280×720 / v1.0</text>
