  <!-- 网格备注 -->
  <text x="1248" y="284" font-size="11.5" fill="#5a6572" text-anchor="end">6 列 × 2 排 = 12 个英雄</text>
  <text x="1248" y="302" font-size="11.5" fill="#5a6572" text-anchor="end">红虚框 = 未解锁（点了没反应，</text>
  <text x="1248" y="320" font-size="11.5" fill="#5a6572" text-anchor="end">也没写怎么解锁 —— 待办 T3）</text>
  <text x="1248" y="344" font-size="11.5" fill="#8a93a5" text-anchor="end">第一排 H001~H006</text>
  <text x="1248" y="362" font-size="11.5" fill="#8a93a5" text-anchor="end">第二排 H007~H012</text>

  <!-- ============ L3 详情面板（190 高，底 #252a34，圆角 8，内边距 12/8） ============ -->
  <rect x="32" y="430" width="1216" height="190" rx="8" fill="#252a34"/>
  <g>
    <!-- ① 名字行 -->
    <text x="44" y="458" font-size="20" font-weight="700" fill="#e8b33c">猎手</text>
    <rect x="92" y="442" width="44" height="22" rx="4" fill="#2a3a5a"/>
    <text x="114" y="458" font-size="13" fill="#e2e6ee" text-anchor="middle">输出</text>
    <text x="148" y="458" font-size="15" fill="#8a93a5">HOPS</text>
    <text x="204" y="458" font-size="15" font-weight="700" fill="#e2e6ee">Lv1</text>
    <text x="1236" y="458" font-size="11" fill="#5a6572" text-anchor="end">局外等级</text>

    <!-- ② 属性行 -->
