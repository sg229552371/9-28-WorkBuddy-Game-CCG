    <text x="107" y="386" font-size="13" fill="#4b5462" text-anchor="middle">局外 LV1</text>
  </g>
  <!-- 8 陷阱师（未解锁） -->
  <g>
    <rect x="190" y="264" width="150" height="150" rx="8" fill="#1f232b"/>
    <rect x="241" y="272" width="48" height="48" rx="6" fill="#2a3a5a"/>
    <text x="265" y="305" font-size="24" font-weight="700" fill="#5a6572" text-anchor="middle">陷</text>
    <text x="265" y="344" font-size="17" fill="#5a6572" text-anchor="middle">陷阱师</text>
    <text x="265" y="365" font-size="14" fill="#4b5462" text-anchor="middle">☆☆</text>
