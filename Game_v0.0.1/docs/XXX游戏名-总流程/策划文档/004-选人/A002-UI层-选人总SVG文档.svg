    <text x="107" y="147" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">猎</text>
    <text x="107" y="186" font-size="17" fill="#e2e6ee" text-anchor="middle">猎手</text>
    <text x="107" y="207" font-size="14" fill="#e8b33c" text-anchor="middle">★</text>
    <text x="107" y="228" font-size="13" fill="#8a93a5" text-anchor="middle">局外 LV1</text>
