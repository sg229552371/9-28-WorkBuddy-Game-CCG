  </defs>

  <!-- ============ L0 背景 ============ -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#chrBg)"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#chrGlow)"/>
  <g stroke="#1b2637" stroke-width="1" opacity="0.45">
    <path d="M0 660 L1280 640"/><path d="M160 720 L220 540"/><path d="M1120 720 L1060 540"/>
  </g>

  <!-- ============ L1 铺满屏幕的面板（圆角 10，内边距 上下16 / 左右24） ============ -->
  <rect x="8" y="8" width="1264" height="704" rx="10" fill="#1d2027" stroke="#252a34" stroke-width="2"/>
  <rect x="8" y="8" width="1264" height="3" rx="1.5" fill="#e8b33c" opacity="0.45"/>

  <!-- 标题行 -->
  <text x="32" y="58" font-size="30" font-weight="700" fill="#e8b33c" letter-spacing="3">角色选择</text>
  <text x="32" y="82" font-size="13" fill="#8a93a5">点英雄挑 1~3 个 · 再点一次取消 · 第一个点的人是队长</text>
  <text x="1248" y="56" font-size="22" font-weight="700" fill="#e8b33c" text-anchor="end">✦结晶 330</text>
  <text x="1248" y="80" font-size="11" fill="#5a6572" text-anchor="end">进屏时读一次</text>

  <path d="M32 94 L1248 94" stroke="#2b3240" stroke-width="1"/>

