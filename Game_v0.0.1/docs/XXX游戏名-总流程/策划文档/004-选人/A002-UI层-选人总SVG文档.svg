    <text x="66" y="548" font-size="13" fill="#e0a3a3" text-anchor="middle">缺点</text>
    <rect x="96" y="532" width="62" height="22" rx="4" fill="#3a3f4a"/>
    <text x="127" y="548" font-size="13" fill="#8a93a5" text-anchor="middle">待配置</text>

    <!-- ⑤ 羁绊 -->
    <text x="44" y="578" font-size="15" fill="#8a93a5">羁绊：待配置</text>

    <!-- ⑥ 进化结晶 -->
