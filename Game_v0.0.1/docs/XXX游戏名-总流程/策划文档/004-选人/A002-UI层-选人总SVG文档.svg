<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <title>004-选人 · 整屏总图（1280×720 实尺寸）</title>

  <defs>
    <linearGradient id="chrBg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#131c2c"/>
      <stop offset="1" stop-color="#0d1017"/>
    </linearGradient>
    <radialGradient id="chrGlow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#e8b33c" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#e8b33c" stop-opacity="0"/>
    </radialGradient>
    <filter id="chrShadow" x="-30%" y="-60%" width="160%" height="240%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="chrGlowGold" x="-30%" y="-60%" width="160%" height="240%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#e8b33c" flood-opacity="0.4"/>
    </filter>
    <marker id="chrA1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8b33c"/>
