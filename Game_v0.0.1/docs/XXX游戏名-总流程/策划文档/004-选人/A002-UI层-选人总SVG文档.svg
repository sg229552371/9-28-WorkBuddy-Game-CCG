    <text x="739" y="386" font-size="13" fill="#8a93a5" text-anchor="middle">局外 LV1</text>
  </g>
  <!-- 12 灵能者（未解锁） -->
  <g>
    <rect x="822" y="264" width="150" height="150" rx="8" fill="#1f232b"/>
    <rect x="873" y="272" width="48" height="48" rx="6" fill="#2a3a5a"/>
    <text x="897" y="305" font-size="24" font-weight="700" fill="#5a6572" text-anchor="middle">灵</text>
    <text x="897" y="344" font-size="17" fill="#5a6572" text-anchor="middle">灵能者</text>
    <text x="897" y="365" font-size="14" fill="#4b5462" text-anchor="middle">☆</text>
    <text x="897" y="386" font-size="13" fill="#4b5462" text-anchor="middle">局外 LV1</text>
    <rect x="824" y="266" width="146" height="146" rx="8" fill="none" stroke="#e2554f" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
