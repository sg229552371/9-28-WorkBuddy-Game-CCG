    <!-- 右侧空提示 -->
    <text x="1236" y="578" font-size="11" fill="#5a6572" text-anchor="end">详情跟「最后点过的人」走 ——</text>
    <text x="1236" y="598" font-size="11" fill="#5a6572" text-anchor="end">取消选择时它不会清空（行为不一致，待办 T4）</text>
  </g>

  <!-- ============ L4 底部按钮 ============ -->
  <g filter="url(#chrShadow)">
    <rect x="32" y="638" width="140" height="48" rx="8" fill="#252a34"/>
  </g>
  <text x="102" y="668" font-size="20" fill="#e2e6ee" text-anchor="middle">返回</text>

  <g filter="url(#chrShadow)">
    <rect x="1028" y="638" width="220" height="48" rx="8" fill="#252a34" stroke="#e8b33c" stroke-width="2"/>
  </g>
  <text x="1138" y="668" font-size="20" font-weight="700" fill="#e8b33c" text-anchor="middle">开始出战 (1/3)</text>

  <!-- 底部说明 -->
  <text x="192" y="668" font-size="11.5" fill="#5a6572">左下 · 140×48 · 无边框（退路，永远能点）</text>
  <text x="1012" y="668" font-size="11.5" fill="#5a6572" text-anchor="end">右下 · 220×48 · 金边金字「正事」</text>

  <!-- 顶部尺寸标注 -->
