    <text x="1236" y="488" font-size="11" fill="#5a6572" text-anchor="end">没有「挖掘」——12 个英雄都没这个字段</text>

    <!-- ③ 优点 -->
    <rect x="44" y="502" width="44" height="22" rx="4" fill="#2e4a36"/>
    <text x="66" y="518" font-size="13" fill="#9fe0af" text-anchor="middle">优点</text>
    <rect x="96" y="502" width="44" height="22" rx="4" fill="#2e4a36"/>
    <text x="118" y="518" font-size="13" fill="#9fe0af" text-anchor="middle">敏捷</text>

    <!-- ④ 缺点 -->
