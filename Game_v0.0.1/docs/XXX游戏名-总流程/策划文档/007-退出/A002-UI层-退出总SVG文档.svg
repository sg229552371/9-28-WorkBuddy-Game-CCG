<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <title>007-退出 · 整屏总图（现状 + 设计稿对照）</title>

  <defs>
    <linearGradient id="qtBg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#131c2c"/>
      <stop offset="0.55" stop-color="#101725"/>
      <stop offset="1" stop-color="#0b1119"/>
    </linearGradient>
    <linearGradient id="qtMask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="qtGoldBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c257"/>
      <stop offset="1" stop-color="#dcac33"/>
    </linearGradient>
    <linearGradient id="qtDangerBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef6a63"/>
      <stop offset="1" stop-color="#d84740"/>
    </linearGradient>
    <filter id="qtShadow" x="-30%" y="-60%" width="160%" height="240%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="qtShadowBig" x="-40%" y="-70%" width="180%" height="260%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#qtBg)"/>

  <!-- ===================================================== -->
  <!-- 左：现状（整屏换屏）                                    -->
  <!-- ===================================================== -->
  <text x="56" y="48" font-size="13" font-weight="700" fill="#e0a3a3">现状 · 整屏换屏（flow_root.gd _build_goodbye 549~562 行）</text>

  <!-- 外面套一个小“显示器”框，表示这是整屏 -->
  <g filter="url(#qtShadow)">
    <rect x="56" y="62" width="560" height="398" rx="10" fill="#1d2027" stroke="#252a34" stroke-width="2"/>
  </g>
  <rect x="56" y="62" width="560" height="398" rx="10" fill="#0b0e13" opacity="0.25"/>

  <!-- 内边距 24/16 -->
  <text x="80" y="104" font-size="30" font-weight="700" fill="#e8b33c">退出游戏</text>
  <text x="592" y="104" font-size="11" fill="#5a6572" text-anchor="end">30 号 · 金 #e8b33c</text>

  <text x="80" y="146" font-size="16" fill="#e2e6ee">确定要退出游戏吗？</text>
  <text x="592" y="146" font-size="11" fill="#5a6572" text-anchor="end">未设字号，随默认</text>

  <rect x="80" y="170" width="320" height="52" rx="8" fill="#252a34" stroke="#e8b33c" stroke-width="2"/>
  <text x="240" y="203" font-size="20" font-weight="700" fill="#e8b33c" text-anchor="middle">确认退出</text>
  <text x="416" y="203" font-size="11" fill="#5a6572">金描边 2px · 真能 quit()</text>

  <rect x="80" y="232" width="320" height="52" rx="8" fill="#252a34" stroke="#3a4150" stroke-width="1.5"/>
  <text x="240" y="265" font-size="20" fill="#e2e6ee" text-anchor="middle">返回首页</text>
  <text x="416" y="265" font-size="11" fill="#5a6572">无描边 · 回主菜单</text>

  <!-- 大片空白 -->
  <g stroke="#2b3240" stroke-width="1" stroke-dasharray="4 6">
    <line x1="80" y1="320" x2="592" y2="320"/>
  </g>
  <text x="336" y="344" font-size="11" fill="#5a6572" text-anchor="middle">↓ 下面近 400px 全空 ← 这正是「不是弹窗」的证据</text>

  <!-- 空白区放大标识 -->
  <g>
    <rect x="80" y="360" width="512" height="78" rx="8" fill="#14181f" stroke="#2b3240" stroke-dasharray="6 5"/>
    <g font-size="11.5" fill="#8a93a5">
      <text x="96" y="384">没有黑幕 · 没有弹窗 · 没有 Esc / 回车 / 点空白</text>
      <text x="96" y="404">主菜单整个被隐藏（node.visible = key == name_key）</text>
      <text x="96" y="424" fill="#e0a3a3">观感 = 「跳到另一页了」，不是「被问了一句」</text>
    </g>
  </g>

  <!-- 左侧尺寸标注 -->
  <g opacity="0.9">
    <g stroke="#e8b33c" stroke-width="1" stroke-dasharray="5 4" fill="none">
      <path d="M592 62 L612 62 M592 460 L612 460"/>
      <path d="M80 62 L80 52 M592 62 L592 52 M80 56 L592 56"/>
      <path d="M56 170 L46 170 M56 222 L46 222 M50 170 L50 222"/>
    </g>
    <text x="628" y="480" font-size="10.5" fill="#e8b33c">↑ 整屏 1280×720（此处缩略 560×398）</text>
    <text x="336" y="48" font-size="11" fill="#e8b33c" text-anchor="middle">面板铺满屏 · 内边距 左右24 / 上下16</text>
    <text x="42" y="200" font-size="10.5" fill="#e8b33c" text-anchor="middle" transform="rotate(-90 42 200)">52</text>
  </g>

  <!-- ===================================================== -->
  <!-- 右：设计稿要的样子                                      -->
  <!-- ===================================================== -->
  <text x="664" y="48" font-size="13" font-weight="700" fill="#9fe0af">设计稿要求 · 60% 黑幕 + 420×200 弹窗（001/B004 第二节，目标态）</text>

  <!-- 假主菜单（被遮） -->
  <g>
    <rect x="664" y="62" width="560" height="398" rx="10" fill="#131c2c" stroke="#2b3240"/>
    <g opacity="0.45">
      <text x="944" y="152" font-size="22" font-weight="700" fill="#e8b33c" text-anchor="middle">弹幕射击 × 背包肉鸽</text>
      <rect x="784" y="186" width="320" height="44" rx="6" fill="#e8b33c"/>
      <text x="944" y="214" font-size="17" font-weight="700" fill="#131c2c" text-anchor="middle">开始游戏</text>
      <rect x="784" y="242" width="320" height="36" rx="6" fill="#252a34"/>
      <text x="944" y="266" font-size="15" fill="#e2e6ee" text-anchor="middle">操作说明</text>
      <rect x="784" y="290" width="320" height="36" rx="6" fill="#252a34"/>
      <text x="944" y="314" font-size="15" fill="#e2e6ee" text-anchor="middle">设置</text>
      <rect x="784" y="338" width="320" height="36" rx="6" fill="#252a34"/>
      <text x="944" y="362" font-size="15" fill="#e2e6ee" text-anchor="middle">图鉴</text>
      <rect x="784" y="386" width="320" height="36" rx="6" fill="#252a34"/>
      <text x="944" y="410" font-size="15" fill="#e2e6ee" text-anchor="middle">退出游戏</text>
    </g>
    <!-- 60% 黑幕 -->
    <rect x="664" y="62" width="560" height="398" rx="10" fill="#000000" opacity="0.6"/>
  </g>

  <!-- 弹窗：设计 420×200，此处 1:0.82 缩略 -->
  <g filter="url(#qtShadowBig)">
    <rect x="798" y="188" width="292" height="146" rx="12" fill="#1d2027" stroke="#3a4150" stroke-width="1.5"/>
  </g>
  <g>
    <circle cx="1062" cy="206" r="12" fill="#252a34"/>
    <text x="1062" y="211" font-size="14" fill="#8a93a5" text-anchor="middle">✕</text>
  </g>
  <text x="944" y="240" font-size="17" fill="#e2e6ee" text-anchor="middle">确定要退出游戏吗？</text>

  <rect x="816" y="272" width="116" height="38" rx="8" fill="url(#qtDangerBtn)"/>
  <text x="874" y="297" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">退 出</text>

  <rect x="956" y="272" width="116" height="38" rx="8" fill="#252a34" stroke="#3a4150"/>
  <text x="1014" y="297" font-size="16" fill="#e2e6ee" text-anchor="middle" letter-spacing="2">继 续</text>

  <text x="944" y="324" font-size="10" fill="#5a6572" text-anchor="middle">设计尺寸 420 × 200（此处缩略展示）</text>

  <!-- 尺寸标注 -->
  <g opacity="0.9">
    <g stroke="#e8b33c" stroke-width="1" stroke-dasharray="5 4" fill="none">
      <path d="M798 188 L798 168 M1090 188 L1090 168 M798 172 L1090 172"/>
      <path d="M1090 188 L1108 188 M1090 334 L1108 334 M1098 188 L1098 334"/>
    </g>
    <text x="944" y="162" font-size="10.5" fill="#e8b33c" text-anchor="middle">420（缩略）</text>
    <text x="1114" y="265" font-size="10.5" fill="#e8b33c">200</text>
    <text x="700" y="90" font-size="11" fill="#e8b33c">黑幕 60% #000 / opacity 0.6</text>
  </g>

  <!-- 两种形态对比条 -->
  <g>
    <line x1="56" y1="484" x2="1224" y2="484" stroke="#2a2f3a"/>
    <text x="56" y="514" font-size="13" font-weight="700" fill="#e8b33c">逐项对照</text>
  </g>
  <g font-size="12">
    <g fill="#8a93a5">
      <text x="56" y="540">项目</text>
      <text x="160" y="540" fill="#e0a3a3">现状（代码）</text>
      <text x="500" y="540" fill="#9fe0af">设计稿（目标态）</text>
    </g>
    <line x1="56" y1="550" x2="840" y2="550" stroke="#2b3240"/>
    <g fill="#c9ced9">
      <text x="56" y="571">形式</text><text x="160" y="571" fill="#e0a3a3">整屏换屏 1280×720</text><text x="500" y="571" fill="#9fe0af">420×200 居中弹窗</text>
      <text x="56" y="591">黑幕</text><text x="160" y="591" fill="#e0a3a3">无</text><text x="500" y="591" fill="#9fe0af">纯黑 60%</text>
      <text x="56" y="611">按钮</text><text x="160" y="611" fill="#e0a3a3">确认退出 / 返回首页（竖排）</text><text x="500" y="611" fill="#9fe0af">退出 / 继续（左右并排）</text>
      <text x="56" y="631">关闭</text><text x="160" y="631" fill="#e0a3a3">只有两个按钮</text><text x="500" y="631" fill="#9fe0af">Esc / 回车 / 点黑幕 / ✕ = 继续</text>
      <text x="56" y="651">圆角</text><text x="160" y="651" fill="#e0a3a3">10（铺满看不见）</text><text x="500" y="651" fill="#9fe0af">12</text>
    </g>
  </g>

  <!-- 右侧红字：差异结论 -->
  <g>
    <rect x="860" y="508" width="364" height="152" rx="8" fill="#1a1414" stroke="#e2554f" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="860" y="508" width="364" height="6" rx="3" fill="#e2554f"/>
    <text x="876" y="536" font-size="13" font-weight="700" fill="#ff8a84">⚠ 差异结论</text>
    <g font-size="11.5" fill="#e0a3a3">
      <text x="876" y="558">现状是整屏换屏；设计稿要求半透明弹窗</text>
      <text x="876" y="576">盖在主菜单上——建议改成弹窗。</text>
      <text x="876" y="600" fill="#c9ced9">改一个地方动三条：面板缩到 420×200、</text>
      <text x="876" y="618" fill="#c9ced9">背后加黑幕、按钮文字与排布一起改。</text>
      <text x="876" y="642" fill="#8a93a5">弹窗长相以 001/B004 为准（007 总纲 分-1），</text>
      <text x="876" y="660" fill="#8a93a5">口径细节见 B001-退出确认。</text>
    </g>
  </g>

  <!-- 规格速查 -->
  <g>
    <rect x="56" y="672" width="780" height="28" rx="6" fill="#0d1017" stroke="#2b3240"/>
    <text x="70" y="691" font-size="11" fill="#8d95a5">规格速查：面板 <tspan fill="#e2e6ee">#1d2027</tspan> rx10 边 <tspan fill="#e2e6ee">#252a34</tspan> 2px　标题 30/32 金 <tspan fill="#e8b33c">#e8b33c</tspan>　危险 <tspan fill="#e2554f">#e2554f</tspan>　灰按钮 <tspan fill="#e2e6ee">#252a34</tspan>　文字 <tspan fill="#e2e6ee">#e2e6ee</tspan> / 次要 <tspan fill="#8a93a5">#8a93a5</tspan></text>
  </g>

  <text x="1248" y="708" font-size="11" fill="#5d6575" text-anchor="end">A002-UI层-退出总SVG文档 / 1280×720 / v1.0</text>
</svg>
