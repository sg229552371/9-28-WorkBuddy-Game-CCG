<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <title>B003-设置 · 设置窗口细化图 v3.0（参考同类游戏设置页：分页签 + 分组行式 + ON/OFF 分段开关 + 滑杆 + 右侧说明栏 + 底部按键提示）</title>

  <defs>
    <linearGradient id="stPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181f2c"/>
      <stop offset="1" stop-color="#131925"/>
    </linearGradient>
    <filter id="stShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ============ 背景：主菜单被 60% 黑幕压暗 ============ -->
  <rect x="0" y="0" width="1280" height="720" fill="#10151d"/>
  <g opacity="0.25">
    <text x="64" y="122" font-size="46" font-weight="800" fill="#e8b33c" letter-spacing="4">弹幕射击 × 背包肉鸽</text>
    <rect x="64" y="216" width="300" height="68" rx="16" fill="#dcac33"/>
    <rect x="64" y="300" width="210" height="52" rx="12" fill="#1d2432" stroke="#3a4150"/>
    <rect x="64" y="368" width="210" height="52" rx="12" fill="#1d2432" stroke="#3a4150"/>
    <rect x="64" y="436" width="210" height="52" rx="12" fill="#1d2432" stroke="#3a4150"/>
    <text x="169" y="259" font-size="28" font-weight="800" fill="#131c2c" text-anchor="middle">开始游戏</text>
    <text x="169" y="333" font-size="19" fill="#e2e6ee" text-anchor="middle">设置</text>
    <text x="169" y="401" font-size="19" fill="#e2e6ee" text-anchor="middle">图鉴</text>
    <text x="169" y="469" font-size="19" fill="#e2e6ee" text-anchor="middle">退出游戏</text>
  </g>
  <rect x="0" y="0" width="1280" height="720" fill="#000000" opacity="0.55"/>

  <!-- ============ 设置窗口面板 960×600 @ (160,60) ============ -->
  <g filter="url(#stShadow)">
    <rect x="160" y="60" width="960" height="600" rx="10" fill="url(#stPanel)" stroke="#3a4150" stroke-width="1.5"/>
  </g>
  <rect x="160" y="60" width="960" height="3" rx="1.5" fill="#e8b33c" opacity="0.85"/>

  <!-- ============ 顶部分页签栏（y 60~118） ============ -->
  <!-- 左端 [Q] 图标钮 -->
  <rect x="184" y="82" width="34" height="30" rx="6" fill="none" stroke="#8a93a5" stroke-width="1.5"/>
  <text x="201" y="103" font-size="15" fill="#e2e6ee" text-anchor="middle" font-weight="700">Q</text>
  <!-- 页签 -->
  <g font-size="16">
    <text x="256" y="103" fill="#e8b33c" font-weight="700">通用</text>
    <path d="M248 114 h52" stroke="#e8b33c" stroke-width="2.5"/>
    <text x="340" y="103" fill="#9aa2b1">画面</text>
    <text x="424" y="103" fill="#9aa2b1">音频</text>
    <text x="508" y="103" fill="#9aa2b1">操作</text>
    <text x="592" y="103" fill="#9aa2b1">控制</text>
  </g>
  <!-- 右端 [Esc] 返回 -->
  <text x="1036" y="103" font-size="14" fill="#9aa2b1">返回</text>
  <rect x="1072" y="82" width="38" height="30" rx="6" fill="none" stroke="#8a93a5" stroke-width="1.5"/>
  <text x="1091" y="103" font-size="14" fill="#e2e6ee" text-anchor="middle" font-weight="700">Esc</text>
  <path d="M160 128 h960" stroke="#2b3240" stroke-width="1.5"/>

  <!-- ============ 左列：分组行式设置区（宽 ~640） ============ -->
  <!-- 分组标题：通用 -->
  <text x="208" y="162" font-size="12" fill="#5d6575">通　用</text>
  <path d="M208 172 h600" stroke="#2b3240" stroke-width="1"/>

  <!-- 行1：HUD 显示 · ON/OFF 分段开关 -->
  <text x="208" y="208" font-size="16" fill="#e8b33c" font-weight="700">HUD 显示</text>
  <circle cx="198" cy="202" r="3" fill="#e8b33c"/>
  <rect x="600" y="186" width="208" height="32" rx="4" fill="#232a38" stroke="#3a4150"/>
  <rect x="600" y="186" width="104" height="32" rx="4" fill="#2e2620" stroke="#e8b33c" stroke-width="1.2"/>
  <text x="652" y="208" font-size="14" fill="#e8b33c" text-anchor="middle" font-weight="700">开</text>
  <text x="756" y="208" font-size="14" fill="#6a7484" text-anchor="middle">关</text>

  <!-- 行2：全屏 · 开/关 -->
  <text x="208" y="256" font-size="16" fill="#e2e6ee">全屏</text>
  <rect x="600" y="234" width="208" height="32" rx="4" fill="#232a38" stroke="#3a4150"/>
  <rect x="600" y="234" width="104" height="32" rx="4" fill="#2e2620" stroke="#e8b33c" stroke-width="1.2"/>
  <text x="652" y="256" font-size="14" fill="#e8b33c" text-anchor="middle" font-weight="700">开</text>
  <text x="756" y="256" font-size="14" fill="#6a7484" text-anchor="middle">关</text>

  <!-- 行3：震屏 · 开/关 -->
  <text x="208" y="304" font-size="16" fill="#e2e6ee">战斗震屏</text>
  <rect x="600" y="282" width="208" height="32" rx="4" fill="#232a38" stroke="#3a4150"/>
  <rect x="600" y="282" width="104" height="32" rx="4" fill="#2e2620" stroke="#e8b33c" stroke-width="1.2"/>
  <text x="652" y="304" font-size="14" fill="#e8b33c" text-anchor="middle" font-weight="700">开</text>
  <text x="756" y="304" font-size="14" fill="#6a7484" text-anchor="middle">关</text>

  <!-- 行4：画质 · 下拉框 -->
  <text x="208" y="352" font-size="16" fill="#e2e6ee">画质</text>
  <rect x="600" y="330" width="208" height="32" rx="4" fill="#232a38" stroke="#3a4150"/>
  <text x="688" y="352" font-size="14" fill="#e2e6ee" text-anchor="middle">中（默认）</text>
  <path d="M788 342 l7 8 7 -8" fill="none" stroke="#8a93a5" stroke-width="1.8"/>

  <!-- 分组标题：战斗 -->
  <text x="208" y="398" font-size="12" fill="#5d6575">战　斗</text>
  <path d="M208 408 h600" stroke="#2b3240" stroke-width="1"/>

  <!-- 行5：伤害数字 · 开/关 -->
  <text x="208" y="444" font-size="16" fill="#e2e6ee">伤害数字</text>
  <rect x="600" y="422" width="208" height="32" rx="4" fill="#232a38" stroke="#3a4150"/>
  <rect x="600" y="422" width="104" height="32" rx="4" fill="#2e2620" stroke="#e8b33c" stroke-width="1.2"/>
  <text x="652" y="444" font-size="14" fill="#e8b33c" text-anchor="middle" font-weight="700">开</text>
  <text x="756" y="444" font-size="14" fill="#6a7484" text-anchor="middle">关</text>

  <!-- 行6：锁定距离 · 滑杆 -->
  <text x="208" y="492" font-size="16" fill="#e2e6ee">自动锁定距离</text>
  <path d="M616 486 h-10 M792 486 h10" stroke="#8a93a5" stroke-width="1.8"/>
  <path d="M618 486 h172" stroke="#3a4150" stroke-width="3" stroke-linecap="round"/>
  <path d="M618 486 h96" stroke="#e8b33c" stroke-width="3" stroke-linecap="round"/>
  <circle cx="714" cy="486" r="8" fill="#e2e6ee" stroke="#131c2c" stroke-width="2"/>
  <text x="714" y="470" font-size="12" fill="#e2e6ee" text-anchor="middle">5</text>

  <!-- 分组标题：语言 -->
  <text x="208" y="538" font-size="12" fill="#5d6575">语　言</text>
  <path d="M208 548 h600" stroke="#2b3240" stroke-width="1"/>

  <!-- 行7：字幕显示 · 开/关 -->
  <text x="208" y="588" font-size="16" fill="#e2e6ee">字幕显示</text>
  <rect x="600" y="566" width="208" height="32" rx="4" fill="#232a38" stroke="#3a4150"/>
  <rect x="600" y="566" width="104" height="32" rx="4" fill="#2e2620" stroke="#e8b33c" stroke-width="1.2"/>
  <text x="652" y="588" font-size="14" fill="#e8b33c" text-anchor="middle" font-weight="700">开</text>
  <text x="756" y="588" font-size="14" fill="#6a7484" text-anchor="middle">关</text>

  <!-- 行8（半露，示意可滚动）：字幕大小 ◄ 小 ► -->
  <g opacity="0.45">
    <text x="208" y="636" font-size="16" fill="#e2e6ee">字幕大小</text>
    <rect x="600" y="612" width="208" height="32" rx="4" fill="#232a38" stroke="#3a4150"/>
    <text x="628" y="633" font-size="11" fill="#8a93a5">◄</text>
    <text x="704" y="633" font-size="14" fill="#e2e6ee" text-anchor="middle">小</text>
    <text x="780" y="633" font-size="11" fill="#8a93a5">►</text>
  </g>

  <!-- ============ 右列：悬停说明栏（竖分隔线） ============ -->
  <path d="M848 128 V620" stroke="#2b3240" stroke-width="1.5"/>
  <path d="M872 436 h96" stroke="#5d6575" stroke-width="1"/>
  <text x="920" y="462" font-size="13" fill="#8a93a5" text-anchor="middle">设置战斗内 HUD</text>
  <text x="920" y="482" font-size="13" fill="#8a93a5" text-anchor="middle">的显示与否。</text>

  <!-- ============ 右下角按键提示胶囊 ============ -->
  <g font-size="12">
    <rect x="872" y="608" width="52" height="24" rx="4" fill="none" stroke="#8a93a5" stroke-width="1.2"/>
    <text x="898" y="624" fill="#e2e6ee" text-anchor="middle" font-size="11">SPACE</text>
    <text x="936" y="624" fill="#9aa2b1">切换</text>
    <rect x="968" y="608" width="26" height="24" rx="4" fill="none" stroke="#8a93a5" stroke-width="1.2"/>
    <text x="981" y="624" fill="#e2e6ee" text-anchor="middle" font-size="11">F</text>
    <text x="1004" y="624" fill="#9aa2b1">重置</text>
    <rect x="1036" y="608" width="34" height="24" rx="4" fill="none" stroke="#8a93a5" stroke-width="1.2"/>
    <text x="1053" y="624" fill="#e2e6ee" text-anchor="middle" font-size="11">ESC</text>
    <text x="1080" y="624" fill="#9aa2b1">关闭</text>
  </g>

  <!-- ============ 标注层（给美术/程序看） ============ -->
  <g opacity="0.55">
    <g stroke="#e8b33c" stroke-width="1" stroke-dasharray="5 4" fill="none">
      <rect x="160" y="60" width="960" height="600"/>
      <rect x="600" y="186" width="208" height="32"/>
    </g>
    <g fill="#e8b33c" font-size="10.5">
      <text x="1128" y="72">设置窗口 960 × 600</text>
      <text x="1128" y="90" fill="#8d95a5">居中覆盖主菜单</text>
      <text x="1128" y="108" fill="#8d95a5">60% 黑幕 · Esc 可关</text>
      <text x="816" y="207">开关 208 × 32</text>
      <text x="816" y="255" fill="#8d95a5">选中=金字+暗金底</text>
    </g>
  </g>

  <!-- 操作说明收纳提示（左下角小图注） -->
  <g opacity="0.9">
    <rect x="176" y="628" width="240" height="22" rx="11" fill="#0d1017" stroke="#2b3240"/>
    <text x="296" y="643" font-size="11" fill="#8d95a5" text-anchor="middle">「操作」页签 = 原「操作说明」内容</text>
  </g>

  <text x="1248" y="708" font-size="11" fill="#5d6575" text-anchor="end">A002-UI层-SVG文档-主菜单 / B003-设置 / v3.0 · 1280×720</text>
</svg>
