<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <desc>B004-退出游戏 确认弹窗规格图</desc>

  <rect width="1280" height="720" fill="#131c2c"/>

  <g opacity="0.35" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="64" y="122" font-size="30" font-weight="bold" fill="#e8b33c">弹幕射击 × 背包肉鸽</text>
    <rect x="64" y="216" width="300" height="68" rx="16" fill="#e8b33c"/>
    <text x="214" y="260" font-size="26" font-weight="bold" fill="#131c2c" text-anchor="middle">开始游戏</text>
    <rect x="64" y="300" width="210" height="52" rx="12" fill="#252a34"/>
    <text x="169" y="333" font-size="18" fill="#e2e6ee" text-anchor="middle">设置</text>
    <rect x="64" y="368" width="210" height="52" rx="12" fill="#252a34"/>
    <text x="169" y="401" font-size="18" fill="#e2e6ee" text-anchor="middle">图鉴</text>
    <rect x="64" y="436" width="210" height="52" rx="12" fill="#252a34"/>
    <text x="169" y="469" font-size="18" fill="#e2e6ee" text-anchor="middle">退出游戏</text>
  </g>
  <text x="120" y="60" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#5a6572">↑ 背后是主菜单（v3.0 布局：Logo 左上 + 左列按钮，次按钮 210 宽），被 60% 黑幕遮住（仍隐约可见）</text>

  <rect x="0" y="0" width="1280" height="720" fill="rgba(0,0,0,0.6)"/>

  <rect x="430" y="260" width="420" height="200" rx="12" fill="#1d2027" stroke="#3a4150"/>

  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="800" y="296" font-size="20" fill="#8a93a5" text-anchor="middle">✕</text>
    <text x="640" y="336" font-size="20" fill="#e2e6ee" text-anchor="middle">确定要退出游戏吗？</text>

    <rect x="470" y="380" width="160" height="48" rx="8" fill="#c63d2f"/>
    <text x="550" y="410" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">退 出</text>

    <rect x="650" y="380" width="160" height="48" rx="8" fill="#252a34" stroke="#3a4150"/>
    <text x="730" y="410" font-size="20" fill="#e2e6ee" text-anchor="middle" letter-spacing="2">继 续</text>
  </g>

  <g stroke="#5a6572" stroke-width="1" stroke-dasharray="3 3" fill="none">
    <line x1="430" y1="260" x2="430" y2="230"/>
    <line x1="850" y1="260" x2="850" y2="230"/>
  </g>
  <text x="430" y="222" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8a93a5" text-anchor="middle">x=430</text>
  <text x="850" y="222" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8a93a5" text-anchor="middle">x=850</text>
  <text x="640" y="500" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6572" text-anchor="middle">弹窗 420 × 200　圆角 12　y=260　投影 y+8 blur24 rgba(0,0,0,0.5)</text>

  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <line x1="80" y1="540" x2="1200" y2="540" stroke="#2a2f3a"/>
    <text x="80" y="572" font-size="15" font-weight="bold" fill="#e8b33c">按钮三态</text>
    <g font-size="13">
      <rect x="80" y="588" width="150" height="40" rx="6" fill="#c63d2f"/>
      <text x="155" y="613" fill="#ffffff" text-anchor="middle">退出 常态</text>
      <rect x="250" y="588" width="150" height="40" rx="6" fill="#d94a3a"/>
      <text x="325" y="613" fill="#ffffff" text-anchor="middle">退出 悬停</text>
      <rect x="420" y="588" width="150" height="40" rx="6" fill="#a8301f"/>
      <text x="495" y="613" fill="#ffffff" text-anchor="middle">退出 按下</text>

      <rect x="600" y="588" width="150" height="40" rx="6" fill="#252a34" stroke="#3a4150"/>
      <text x="675" y="613" fill="#e2e6ee" text-anchor="middle">继续 常态</text>
      <rect x="770" y="588" width="150" height="40" rx="6" fill="#313746" stroke="#3a4150"/>
      <text x="845" y="613" fill="#e2e6ee" text-anchor="middle">继续 悬停</text>
      <rect x="940" y="588" width="150" height="40" rx="6" fill="#1c202a" stroke="#3a4150"/>
      <text x="1015" y="613" fill="#e2e6ee" text-anchor="middle">继续 按下</text>
    </g>

    <text x="80" y="672" font-size="13" fill="#8a93a5">关闭方式：Esc / 回车 / 点黑幕 / 点 ✕ —— 四种都等于「继续」，绝不默认退出</text>
    <text x="80" y="698" font-size="13" fill="#8a93a5">动画：弹出 黑幕淡入+弹窗 0.9→1.0 缩放 150ms 缓出　│　关闭 1.0→0.95 + 黑幕淡出 100ms</text>
  </g>
</svg>
