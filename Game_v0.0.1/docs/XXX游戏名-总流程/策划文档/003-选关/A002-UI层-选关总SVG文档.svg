    <path d="M286 112 L286 208" stroke="#e8b33c" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="280" y="164" font-size="11" fill="#e8b33c" text-anchor="end">96</text>
    <!-- 间距 10 -->
