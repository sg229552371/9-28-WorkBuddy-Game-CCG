    <!-- 面板高 680 -->
    <path d="M268 20 L268 700" stroke="#e8b33c" stroke-width="1" stroke-dasharray="5 4"/>
    <path d="M262 20 L274 20 M262 700 L274 700 M262 0 L274 0 M262 720 L274 720" stroke="#e8b33c" stroke-width="1"/>
