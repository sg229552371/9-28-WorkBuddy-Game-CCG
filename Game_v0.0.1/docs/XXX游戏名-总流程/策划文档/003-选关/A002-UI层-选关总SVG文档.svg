    <text x="1018" y="656" font-size="13" fill="#e2e6ee">y=20..700，上下各留 20</text>
    <text x="1018" y="676" font-size="11" fill="#8a93a5">「返回主城」按钮完整可见</text>
    <text x="1018" y="688" font-size="11" fill="#8a93a5">代码第 596 行待按此改（待办 T1）</text>
  </g>

