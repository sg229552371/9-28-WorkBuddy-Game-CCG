<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <title>B004 武器匠 规格图（武器行 + 强化成本公式）</title>

  <defs>
    <linearGradient id="ctyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1017"/>
      <stop offset="1" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="ctyBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3444"/>
      <stop offset="1" stop-color="#222936"/>
    </linearGradient>
    <filter id="ctyShadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <marker id="ctyArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8b33c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#ctyBg)"/>
  <g stroke="rgba(61,79,107,0.14)" stroke-width="1">
    <path d="M0 64 H1280 M0 128 H1280 M0 192 H1280 M0 256 H1280 M0 320 H1280 M0 384 H1280 M0 448 H1280 M0 512 H1280 M0 576 H1280 M0 640 H1280 M0 704 H1280"/>
    <path d="M64 0 V720 M128 0 V720 M192 0 V720 M256 0 V720 M320 0 V720 M384 0 V720 M448 0 V720 M512 0 V720 M576 0 V720 M640 0 V720 M704 0 V720 M768 0 V720 M832 0 V720 M896 0 V720 M960 0 V720 M1024 0 V720 M1088 0 V720 M1152 0 V720 M1216 0 V720"/>
  </g>

  <!-- 页眉 -->
  <text x="32" y="40" font-size="13" fill="#5d6575" letter-spacing="3">002-主城 / 点位 03</text>
  <text x="32" y="70" font-size="24" font-weight="700" fill="#ffd76a">武器匠</text>
  <text x="32" y="92" font-size="12" fill="#a6b2c7">圈 (486, 230) r 76 金 #ffd76a ⚔　｜　面板 420 宽 @ (810, 90)　｜　最高 Lv.100</text>
  <text x="32" y="110" font-size="12" fill="#8d95a5">花结晶强化「专属武器（连带技能）」。和强化导师长得一样，所以圈必须是金的、导师是紫的</text>
  <line x1="32" y1="122" x2="1248" y2="122" stroke="#2b3240" stroke-width="1"/>

  <!-- ============ 左：NPC 圈 ============ -->
  <g id="ctyNpc">
    <text x="32" y="150" font-size="12" fill="#e8b33c" letter-spacing="1">NPC 圈 · 圈内（面板已弹出）</text>
    <circle cx="196" cy="330" r="76" fill="none" stroke="#ffd76a" stroke-width="2" stroke-dasharray="14 12"/>
    <circle cx="196" cy="330" r="76" fill="#ffd76a" fill-opacity="0.05"/>
    <circle cx="196" cy="330" r="22" fill="rgba(18,28,46,0.9)" stroke="#ffd76a" stroke-width="2.5"/>
    <text x="196" y="337" font-size="18" fill="#ffd76a" text-anchor="middle">⚔</text>
    <text x="196" y="222" font-size="16" fill="#e8e2c8" text-anchor="middle">武器匠</text>
    <text x="196" y="240" font-size="12" fill="#a6b2c7" text-anchor="middle">武器 / 技能等级</text>
    <circle cx="236" cy="384" r="11" fill="#40e0c0"/>
    <path d="M196 330 L272 330" stroke="#e8b33c" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="234" y="324" font-size="11" fill="#e8b33c" text-anchor="middle">r 76</text>

    <!-- 与导师的区分 -->
    <rect x="32" y="436" width="336" height="112" rx="8" fill="#101823" stroke="#2b3440"/>
    <text x="48" y="456" font-size="11.5" font-weight="700" fill="#e8b33c">和强化导师怎么分清（最容易搞混的一对）</text>
    <line x1="48" y1="466" x2="352" y2="466" stroke="#2b3240"/>
    <text x="48" y="484" font-size="10.5" fill="#8d95a5">　　　　　强化导师　　　武器匠</text>
    <text x="48" y="500" font-size="10.5" fill="#a6b2c7">升什么　　人　　　　　武器+技能</text>
    <text x="48" y="516" font-size="10.5" fill="#a6b2c7">上限　　　Lv.46　　　　Lv.100</text>
    <text x="48" y="532" font-size="10.5" fill="#a6b2c7">认人　　　紫 ✦　　　　金 ⚔</text>

    <text x="32" y="580" font-size="11" fill="#5d6575">两个面板结构完全相同（一行一项 + 一个按钮），</text>
    <text x="32" y="596" font-size="11" fill="#5d6575">区分只能靠圈的颜色与符号 —— 所以颜色不许撞。</text>
  </g>

  <line x1="372" y1="140" x2="372" y2="628" stroke="#2b3240" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- ============ 中：面板 1:1 ============ -->
  <g id="ctyPanel">
    <text x="392" y="150" font-size="12" fill="#e8b33c" letter-spacing="1">面板（1:1，420 × 216）</text>
    <g filter="url(#ctyShadow)">
      <rect x="392" y="160" width="420" height="216" rx="10" fill="#16233a" stroke="#c9a84c" stroke-width="2"/>
    </g>
    <text x="410" y="192" font-size="22" font-weight="700" fill="#ffd76a">武器匠</text>
    <text x="410" y="214" font-size="13" fill="#a6b2c7">消耗结晶强化专属武器</text>
    <line x1="410" y1="226" x2="794" y2="226" stroke="#c9a84c" stroke-opacity="0.45" stroke-width="1"/>

    <text x="410" y="254" font-size="14" fill="#e8e2c8">回旋刃</text>
    <text x="470" y="254" font-size="13" fill="#a6b2c7">Lv.7</text>
    <rect x="648" y="236" width="146" height="30" rx="5" fill="url(#ctyBtn)" stroke="#c9a84c" stroke-width="1.5"/>
    <text x="721" y="256" font-size="13" fill="#ffd76a" text-anchor="middle">强化 ◆150</text>
    <line x1="410" y1="280" x2="794" y2="280" stroke="#232a36" stroke-width="1"/>

    <text x="410" y="302" font-size="14" fill="#e8e2c8">长弓</text>
    <text x="454" y="302" font-size="13" fill="#a6b2c7">Lv.1</text>
    <rect x="648" y="284" width="146" height="30" rx="5" fill="url(#ctyBtn)" stroke="#c9a84c" stroke-width="1.5"/>
    <text x="721" y="304" font-size="13" fill="#ffd76a" text-anchor="middle">强化 ◆120</text>
    <line x1="410" y1="328" x2="794" y2="328" stroke="#232a36" stroke-width="1"/>

    <text x="410" y="350" font-size="14" fill="#e8e2c8">法杖</text>
    <text x="454" y="350" font-size="13" fill="#a6b2c7">Lv.100</text>
    <rect x="648" y="332" width="146" height="30" rx="5" fill="#1c2431" stroke="#3a4150" stroke-width="1.5"/>
    <text x="721" y="352" font-size="13" fill="#5a6572" text-anchor="middle">已满级</text>

    <g stroke="#e8b33c" stroke-width="1" stroke-dasharray="4 3">
      <path d="M392 136 H812" marker-start="url(#ctyArrow)" marker-end="url(#ctyArrow)"/>
      <path d="M832 160 V376" marker-start="url(#ctyArrow)" marker-end="url(#ctyArrow)"/>
    </g>
    <text x="602" y="132" font-size="11" fill="#e8b33c" text-anchor="middle">420</text>
    <text x="848" y="272" font-size="11" fill="#e8b33c" transform="rotate(90 848 272)" text-anchor="middle">高随内容</text>
  </g>

  <!-- ============ 成本公式卡 ============ -->
  <g id="ctyCost">
    <rect x="392" y="400" width="420" height="228" rx="10" fill="#101823" stroke="#c9a84c" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="410" y="424" font-size="12" font-weight="700" fill="#ffd76a" letter-spacing="1">强化成本公式</text>
    <text x="410" y="444" font-size="10.5" fill="#5d6575">出处：city_visual.gd 第 397~401 行 · 参数读 cfg/weaponLevel.json</text>

    <rect x="410" y="456" width="384" height="52" rx="6" fill="#0b0f16" stroke="#3a4150"/>
    <text x="424" y="480" font-size="13" fill="#e8e2c8">成本 = 向上取整( 基础价 × 成长率^(等级-1)</text>
    <text x="424" y="500" font-size="13" fill="#e8e2c8">　　　　　　　　 ÷ 取整单位 ) × 取整单位</text>

    <g font-size="10.5">
      <text x="410" y="530" fill="#a6b2c7">基础价 costBase</text>
      <text x="540" y="530" fill="#8d95a5">默认 120（配置缺字段时兜底 100）</text>
      <text x="410" y="550" fill="#a6b2c7">成长率 costGrowth</text>
      <text x="540" y="550" fill="#8d95a5">默认 1.05；&lt; 1 必须在配置校验里拦住</text>
      <text x="410" y="570" fill="#a6b2c7">取整单位 costRound</text>
      <text x="540" y="570" fill="#8d95a5">默认 10；结果向上取到 10 的倍数</text>
      <text x="410" y="590" fill="#a6b2c7">最高等级 maxLv</text>
      <text x="540" y="590" fill="#8d95a5">100；到了显示「已满级」并不再算价</text>
    </g>

    <line x1="410" y1="602" x2="794" y2="602" stroke="#2b3240"/>
    <text x="410" y="620" font-size="10.5" fill="#e2554f">注意：文档里不许抄死「3 级要 133」这类数字——调倍率后立刻变成假话。</text>
  </g>

  <!-- ============ 右：按钮状态 ============ -->
  <g id="ctyBtnStates">
    <text x="840" y="150" font-size="12" fill="#e8b33c" letter-spacing="1">强化按钮 · 状态（1:1）</text>

    <rect x="840" y="162" width="140" height="30" rx="5" fill="url(#ctyBtn)" stroke="#c9a84c" stroke-width="1.5"/>
    <text x="910" y="182" font-size="13" fill="#ffd76a" text-anchor="middle">强化 ◆150</text>
    <text x="992" y="176" font-size="11.5" fill="#e8e2c8">可强化</text>
    <text x="992" y="191" font-size="10.5" fill="#5d6575">未满级且结晶够</text>

    <rect x="840" y="212" width="140" height="30" rx="5" fill="#1f1a14" stroke="#7a5f22" stroke-width="1.5"/>
    <text x="910" y="232" font-size="13" fill="#a5873f" text-anchor="middle">强化 ◆150</text>
    <text x="992" y="226" font-size="11.5" fill="#e2554f">结晶不足</text>
    <text x="992" y="241" font-size="10.5" fill="#5d6575">现在仍亮着，点了没反应</text>

    <rect x="840" y="262" width="140" height="30" rx="5" fill="#1c2431" stroke="#3a4150" stroke-width="1.5"/>
    <text x="910" y="282" font-size="13" fill="#5a6572" text-anchor="middle">已满级</text>
    <text x="992" y="276" font-size="11.5" fill="#8d95a5">已满级 Lv.100</text>
    <text x="992" y="291" font-size="10.5" fill="#5d6575">点不动，不再显示成本</text>

    <!-- 尺寸标注 -->
    <g stroke="#e8b33c" stroke-width="1" stroke-dasharray="4 3">
      <path d="M840 324 H980" marker-start="url(#ctyArrow)" marker-end="url(#ctyArrow)"/>
      <path d="M824 162 V192 M820 162 H828 M820 192 H828"/>
    </g>
    <text x="910" y="338" font-size="10.5" fill="#e8b33c" text-anchor="middle">146</text>
    <text x="812" y="181" font-size="10.5" fill="#e8b33c" text-anchor="end">30</text>
  </g>

  <!-- ============ 右：区域说明 ============ -->
  <g>
    <rect x="840" y="360" width="408" height="120" rx="8" fill="#101823" stroke="#2b3440"/>
    <text x="856" y="380" font-size="11.5" font-weight="700" fill="#e8b33c">区域拆解</text>
    <text x="856" y="400" font-size="10.5" fill="#a6b2c7">左段（占满剩余宽）：武器名　Lv.等级 —— 正文 #e8e2c8，14 号</text>
    <text x="856" y="418" font-size="10.5" fill="#a6b2c7">右段：按钮 146 × 30，rx 5 —— 与导师面板同一位置、同一样式</text>
    <text x="856" y="436" font-size="10.5" fill="#a6b2c7">行高 46；行间分隔线 1px #232a36（不满级也画）</text>
    <text x="856" y="454" font-size="10.5" fill="#a6b2c7">列表超过 10 行必须有可见滚动条，否则玩家以为只有 10 件</text>
    <text x="856" y="472" font-size="10.5" fill="#5d6575">武器表为空 → 只剩标题 + 横线，这是配置坏了</text>
  </g>

  <!-- ============ 右：已知问题 ============ -->
  <g>
    <rect x="840" y="490" width="408" height="138" rx="8" fill="#2a1b1b" stroke="#e2554f" stroke-opacity="0.5"/>
    <text x="856" y="510" font-size="11.5" font-weight="700" fill="#e2554f">⚠ 真实状况</text>
    <text x="856" y="530" font-size="10.5" fill="#b08a8a">· 结晶不足时按钮不变灰，只记一条后台日志，玩家看到的仍是亮按钮</text>
    <text x="856" y="548" font-size="10.5" fill="#b08a8a">· 无连点保护：每一下独立结算，会连升多级连扣多次钱</text>
    <text x="856" y="566" font-size="10.5" fill="#b08a8a">· 副标题写「武器 / 技能等级」，但代码只改了武器等级，</text>
    <text x="856" y="582" font-size="10.5" fill="#b08a8a">　技能是否同步变强尚未核实 → 若不同步，副标题必须改</text>
    <text x="856" y="600" font-size="10.5" fill="#b08a8a">· 价格计算本身正确：先算价再查钱，显示价 = 实扣价</text>
    <text x="856" y="618" font-size="10.5" fill="#5d6575">· 无音效：建议金属「铛」声，和导师的「叮」区分开</text>
  </g>

  <text x="1248" y="708" font-size="11" fill="#5d6575" text-anchor="end">B004-武器匠 / 1280×720 / v1.0</text>
</svg>
