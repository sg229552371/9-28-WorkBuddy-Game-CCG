<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <title>B006 图鉴学者 规格图（4 列色块网格 8 格 / 3 格未解锁）</title>

  <defs>
    <linearGradient id="ctyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1017"/>
      <stop offset="1" stop-color="#161b26"/>
    </linearGradient>
    <filter id="ctyShadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <marker id="ctyArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8b33c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#ctyBg)"/>
  <g stroke="rgba(61,79,107,0.14)" stroke-width="1">
    <path d="M0 64 H1280 M0 128 H1280 M0 192 H1280 M0 256 H1280 M0 320 H1280 M0 384 H1280 M0 448 H1280 M0 512 H1280 M0 576 H1280 M0 640 H1280 M0 704 H1280"/>
    <path d="M64 0 V720 M128 0 V720 M192 0 V720 M256 0 V720 M320 0 V720 M384 0 V720 M448 0 V720 M512 0 V720 M576 0 V720 M640 0 V720 M704 0 V720 M768 0 V720 M832 0 V720 M896 0 V720 M960 0 V720 M1024 0 V720 M1088 0 V720 M1152 0 V720 M1216 0 V720"/>
  </g>

  <!-- 页眉 -->
  <text x="32" y="40" font-size="13" fill="#5d6575" letter-spacing="3">002-主城 / 点位 05</text>
  <text x="32" y="70" font-size="24" font-weight="700" fill="#ffd76a">图鉴学者</text>
  <text x="32" y="92" font-size="12" fill="#a6b2c7">圈 (1024, 307) r 76 蓝 #6cb2ff ❖　｜　面板 420 宽 @ (810, 90)　｜　4 列网格</text>
  <text x="32" y="110" font-size="12" fill="#8d95a5">一面「你见过哪些怪物」的墙：亮的写名字，没见过的是暗块加 ???。管收集欲，不变强、不花钱</text>
  <line x1="32" y1="122" x2="1248" y2="122" stroke="#2b3240" stroke-width="1"/>

  <!-- ============ 左：NPC 圈 ============ -->
  <g id="ctyNpc">
    <text x="32" y="150" font-size="12" fill="#e8b33c" letter-spacing="1">NPC 圈 · 圈内</text>
    <circle cx="150" cy="310" r="76" fill="none" stroke="#6cb2ff" stroke-width="2" stroke-dasharray="14 12"/>
    <circle cx="150" cy="310" r="76" fill="#6cb2ff" fill-opacity="0.05"/>
    <circle cx="150" cy="310" r="22" fill="rgba(18,28,46,0.9)" stroke="#6cb2ff" stroke-width="2.5"/>
    <text x="150" y="316" font-size="16" fill="#6cb2ff" text-anchor="middle">❖</text>
    <text x="150" y="202" font-size="16" fill="#e8e2c8" text-anchor="middle">图鉴学者</text>
    <text x="150" y="220" font-size="12" fill="#a6b2c7" text-anchor="middle">英雄 / 怪物图鉴</text>
    <path d="M150 310 L226 310" stroke="#e8b33c" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="188" y="304" font-size="11" fill="#e8b33c" text-anchor="middle">r 76</text>

    <text x="32" y="424" font-size="11" fill="#8d95a5">进圈即弹面板，没有按钮</text>
    <text x="32" y="442" font-size="11" fill="#8d95a5">出圈即关，无「关闭」</text>
    <text x="32" y="460" font-size="11" fill="#5d6575">副标题写「英雄 / 怪物」，实际只有怪物</text>
  </g>

  <line x1="272" y1="140" x2="272" y2="628" stroke="#2b3240" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- ============ 中：面板 1:1 ============ -->
  <g id="ctyPanel">
    <text x="292" y="150" font-size="12" fill="#e8b33c" letter-spacing="1">面板（1:1，420 × 388）</text>
    <g filter="url(#ctyShadow)">
      <rect x="292" y="160" width="420" height="388" rx="10" fill="#16233a" stroke="#c9a84c" stroke-width="2"/>
    </g>
    <text x="310" y="192" font-size="22" font-weight="700" fill="#ffd76a">图鉴学者</text>
    <text x="310" y="214" font-size="13" fill="#a6b2c7">点亮的条目表示已收录</text>
    <text x="694" y="214" font-size="12" fill="#ffd76a" text-anchor="end">5 / 8</text>
    <line x1="310" y1="226" x2="694" y2="226" stroke="#c9a84c" stroke-opacity="0.45" stroke-width="1"/>

    <!-- 第 1 行 y=238 -->
    <rect x="310" y="238" width="72" height="40" rx="6" fill="#8a5a3c"/>
    <text x="346" y="292" font-size="12" fill="#e8e2c8" text-anchor="middle">岩甲虫</text>
    <rect x="392" y="238" width="72" height="40" rx="6" fill="#4a6b8a"/>
    <text x="428" y="292" font-size="12" fill="#e8e2c8" text-anchor="middle">飞刺蛾</text>
    <rect x="474" y="238" width="72" height="40" rx="6" fill="#252b34" stroke="#1a1f27"/>
    <text x="510" y="292" font-size="12" fill="#6b7383" text-anchor="middle">???</text>
    <rect x="556" y="238" width="72" height="40" rx="6" fill="#252b34" stroke="#1a1f27"/>
    <text x="592" y="292" font-size="12" fill="#6b7383" text-anchor="middle">???</text>

    <!-- 第 2 行 y=308 -->
    <rect x="310" y="308" width="72" height="40" rx="6" fill="#6b4a6b"/>
    <text x="346" y="362" font-size="12" fill="#e8e2c8" text-anchor="middle">骨白祭司</text>
    <rect x="392" y="308" width="72" height="40" rx="6" fill="#3f6b5a"/>
    <text x="428" y="362" font-size="12" fill="#e8e2c8" text-anchor="middle">泥塑俑</text>
    <rect x="474" y="308" width="72" height="40" rx="6" fill="#b04a3a"/>
    <text x="510" y="362" font-size="12" fill="#e8e2c8" text-anchor="middle">赤铁兽</text>
    <rect x="556" y="308" width="72" height="40" rx="6" fill="#252b34" stroke="#1a1f27"/>
    <text x="592" y="362" font-size="12" fill="#6b7383" text-anchor="middle">???</text>

    <!-- 第 3 行 y=378（留白示意继续增长） -->
    <rect x="310" y="378" width="72" height="40" rx="6" fill="#252b34" stroke="#1a1f27"/>
    <text x="346" y="432" font-size="12" fill="#6b7383" text-anchor="middle">???</text>
    <rect x="392" y="378" width="72" height="40" rx="6" fill="#252b34" stroke="#1a1f27"/>
    <text x="428" y="432" font-size="12" fill="#6b7383" text-anchor="middle">???</text>
    <rect x="474" y="378" width="72" height="40" rx="6" fill="#252b34" stroke="#1a1f27"/>
    <text x="510" y="432" font-size="12" fill="#6b7383" text-anchor="middle">???</text>
    <rect x="556" y="378" width="72" height="40" rx="6" fill="#252b34" stroke="#1a1f27"/>
    <text x="592" y="432" font-size="12" fill="#6b7383" text-anchor="middle">???</text>

    <text x="310" y="468" font-size="10.5" fill="#5d6575">网格向下无限长，没有滚动 —— 怪物一多就长到屏幕外</text>
    <text x="310" y="486" font-size="10.5" fill="#5d6575">格子不可点、无悬停反馈（亮块看起来像能点，点了没反应）</text>
    <text x="310" y="508" font-size="10.5" fill="#8d95a5">配色说明</text>
    <rect x="310" y="518" width="12" height="12" rx="2" fill="#8a5a3c"/>
    <text x="328" y="528" font-size="10" fill="#a6b2c7">已解锁 = 怪物自身 sprite 颜色</text>
    <rect x="404" y="518" width="12" height="12" rx="2" fill="#252b34" stroke="#1a1f27"/>
    <text x="422" y="528" font-size="10" fill="#a6b2c7">未解锁 = rgba(31,38,51)</text>

    <!-- 尺寸标注 -->
    <g stroke="#e8b33c" stroke-width="1" stroke-dasharray="4 3">
      <path d="M292 136 H712" marker-start="url(#ctyArrow)" marker-end="url(#ctyArrow)"/>
      <path d="M310 208 V238 M306 208 H314 M306 238 H314"/>
      <path d="M310 278 H392" marker-end="url(#ctyArrow)"/>
      <path d="M392 278 H474" marker-end="url(#ctyArrow)"/>
    </g>
    <text x="502" y="132" font-size="11" fill="#e8b33c" text-anchor="middle">420</text>
    <text x="302" y="224" font-size="9.5" fill="#e8b33c" text-anchor="end">40</text>
    <text x="352" y="274" font-size="9.5" fill="#e8b33c" text-anchor="middle">72</text>
    <text x="434" y="274" font-size="9.5" fill="#e8b33c" text-anchor="middle">10</text>
    <text x="730" y="262" font-size="10.5" fill="#8d95a5">格 72 × 40　rx 6</text>
    <text x="730" y="280" font-size="10.5" fill="#8d95a5">横向间距 10　纵向 10</text>
    <text x="730" y="298" font-size="10.5" fill="#8d95a5">名字 12 号，距块底 14</text>
  </g>

  <line x1="738" y1="140" x2="738" y2="628" stroke="#2b3240" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- ============ 右：关键对比 + 已知问题 ============ -->
  <g id="ctyRight">
    <text x="758" y="150" font-size="12" fill="#e8b33c" letter-spacing="1">两种格子 · 逐格对比（2×）</text>

    <rect x="758" y="162" width="144" height="80" rx="12" fill="#8a5a3c"/>
    <text x="830" y="266" font-size="12" fill="#e8e2c8" text-anchor="middle">岩甲虫</text>
    <text x="830" y="284" font-size="10" fill="#5d6575" text-anchor="middle">已解锁</text>

    <rect x="918" y="162" width="144" height="80" rx="12" fill="#252b34" stroke="#1a1f27" stroke-width="2"/>
    <text x="966" y="212" font-size="26" fill="#4a5260" text-anchor="middle">?</text>
    <text x="990" y="266" font-size="12" fill="#6b7383" text-anchor="middle">???</text>
    <text x="990" y="284" font-size="10" fill="#5d6575" text-anchor="middle">未解锁</text>

    <text x="1080" y="196" font-size="10.5" fill="#a6b2c7">差别只有「有没有颜色」</text>
    <text x="1080" y="212" font-size="10.5" fill="#a6b2c7">和「有没有名字」</text>
    <text x="1080" y="234" font-size="10.5" fill="#a6b2c7">暗块比面板底更暗，</text>
    <text x="1080" y="250" font-size="10.5" fill="#a6b2c7">所以一眼能数清亮了几格</text>
    <text x="1080" y="270" font-size="10.5" fill="#5d6575">找不着颜色时兜底 #333e52</text>

    <line x1="758" y1="306" x2="1248" y2="306" stroke="#2b3240"/>

    <text x="758" y="328" font-size="12" fill="#e8b33c" letter-spacing="1">打开流程（无按钮）</text>
    <g font-size="10.5">
      <rect x="758" y="338" width="104" height="24" rx="4" fill="#16233a" stroke="#2b3440"/>
      <text x="810" y="354" fill="#e8e2c8" text-anchor="middle">走进蓝 ❖ 圈</text>
      <path d="M866 350 H880" stroke="#e8b33c" stroke-width="1.2" marker-end="url(#ctyArrow)"/>
      <rect x="884" y="338" width="104" height="24" rx="4" fill="#16233a" stroke="#2b3440"/>
      <text x="936" y="354" fill="#e8e2c8" text-anchor="middle">读怪物配置</text>
      <path d="M992 350 H1006" stroke="#e8b33c" stroke-width="1.2" marker-end="url(#ctyArrow)"/>
      <rect x="1010" y="338" width="104" height="24" rx="4" fill="#16233a" stroke="#2b3440"/>
      <text x="1062" y="354" fill="#e8e2c8" text-anchor="middle">查已收录名单</text>
      <path d="M1118 350 H1132" stroke="#e8b33c" stroke-width="1.2" marker-end="url(#ctyArrow)"/>
      <rect x="1136" y="338" width="112" height="24" rx="4" fill="#16233a" stroke="#c9a84c"/>
      <text x="1192" y="354" fill="#ffd76a" text-anchor="middle">亮块 / 暗块</text>
    </g>

    <!-- 已知问题 -->
    <rect x="758" y="380" width="490" height="146" rx="8" fill="#2a1b1b" stroke="#e2554f" stroke-opacity="0.5"/>
    <text x="774" y="400" font-size="11.5" font-weight="700" fill="#e2554f">⚠ 三个玩家一进来就会发现的问题</text>
    <text x="774" y="420" font-size="10.5" fill="#b08a8a">① 不能滚：格子往下无限长，屏幕外的怪物「看不见 = 不存在」</text>
    <text x="774" y="438" font-size="10.5" fill="#b08a8a">② 不能点：亮的块看着就是可点的方块，点了毫无反应</text>
    <text x="774" y="456" font-size="10.5" fill="#b08a8a">③ 不知道还差几个：没有「已收录 N / 共 M」，玩家不知道有没有尽头</text>
    <text x="774" y="476" font-size="10.5" fill="#b08a8a">· 副标题写「英雄 / 怪物」，实际只读了怪物表 → 白点进来找不到英雄</text>
    <text x="774" y="494" font-size="10.5" fill="#b08a8a">· 「已收录」名单由谁写入还没确认：若战斗侧从不写，图鉴永远全 ???</text>
    <text x="774" y="512" font-size="10.5" fill="#5d6575">（本图右侧已按建议补画了「5 / 8」计数）</text>

    <!-- 规格速查 -->
    <rect x="758" y="540" width="490" height="88" rx="10" fill="#0d1017" stroke="#3a4150" stroke-width="1.5"/>
    <text x="774" y="560" font-size="12" font-weight="700" fill="#e8b33c">规格速查</text>
    <text x="774" y="580" font-size="10.5" fill="#a6b2c7">面板 420 × 自动 @ (810,90)　内边距 18 / 14　标题 22 #ffd76a</text>
    <text x="774" y="598" font-size="10.5" fill="#a6b2c7">格 72×40 rx6　横纵间距 10　4 列　名字 12 号 #e8e2c8</text>
    <text x="774" y="616" font-size="10.5" fill="#a6b2c7">未解锁 #252b34 + 「???」#6b7383　圈 #6cb2ff r76 ❖</text>
  </g>

  <text x="1248" y="708" font-size="11" fill="#5d6575" text-anchor="end">B006-图鉴学者 / 1280×720 / v1.0</text>
</svg>
